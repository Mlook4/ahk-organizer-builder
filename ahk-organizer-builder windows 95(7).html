<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صانع المنظّم — مولّد سكربتات AutoHotkey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8ECF1; --panel:#FFFFFF; --panel-2:#F4F6F9; --ink:#17202D; --muted:#5A6677; --line:#D2D9E2;
  --accent:#2C57E0; --accent-ink:#FFFFFF; --accent-soft:#E3E9FC; --danger:#C2372F; --warn-bg:#FFF4DC; --warn-ink:#7A4E00;
  --key-top:#FDFDFE; --key-side:#B9C2CE; --key-ink:#1D2633;
  --code-bg:#111A29; --code-ink:#D5DDEA; --code-muted:#6D7C93;
  --radius:10px;
  --ui:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  --mono:"JetBrains Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E131B; --panel:#161D28; --panel-2:#1B2330; --ink:#E4E9F0; --muted:#8F9CAE; --line:#2A3443;
    --accent:#7896FF; --accent-ink:#0B1020; --accent-soft:#1F2A47; --danger:#F07269; --warn-bg:#33290F; --warn-ink:#F3CD7A;
    --key-top:#253247; --key-side:#070B12; --key-ink:#E8EDF5;
    --code-bg:#0A0F18;
  }
}
:root[data-theme="dark"]{
  --bg:#0E131B; --panel:#161D28; --panel-2:#1B2330; --ink:#E4E9F0; --muted:#8F9CAE; --line:#2A3443;
  --accent:#7896FF; --accent-ink:#0B1020; --accent-soft:#1F2A47; --danger:#F07269; --warn-bg:#33290F; --warn-ink:#F3CD7A;
  --key-top:#253247; --key-side:#070B12; --key-ink:#E8EDF5;
  --code-bg:#0A0F18;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 var(--ui); -webkit-font-smoothing:antialiased; }
button,input,select,textarea{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

/* ---------- Header ---------- */
.top{ max-width:1500px; margin:0 auto; padding:26px 20px 18px; display:flex; flex-wrap:wrap; gap:18px 28px; align-items:flex-end; justify-content:space-between; }
.brand h1{ margin:0; font-size:28px; line-height:1.25; font-weight:700; letter-spacing:-.2px; }
.brand p{ margin:6px 0 0; color:var(--muted); max-width:58ch; }
.hero-key{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; color:var(--muted); font-size:15px; }
.hero-key .caps{ gap:8px; }
.hero-key .cap{ font-size:20px; min-width:54px; padding:12px 16px 14px; border-radius:11px; box-shadow:0 5px 0 var(--key-side), 0 7px 14px rgba(10,20,40,.18); }
.toolbar{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }

.btn{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--panel); padding:7px 13px; border-radius:8px; cursor:pointer; font-size:14px; font-weight:500; white-space:nowrap; }
.btn:hover{ border-color:var(--accent); }
.btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.btn.primary:hover{ filter:brightness(1.08); }
.btn.ghost{ background:transparent; }
.btn.danger{ color:var(--danger); }
select.btn{ padding-inline-end:28px; }

/* ---------- Layout ---------- */
.app{ max-width:1500px; margin:0 auto; padding:0 20px 40px; display:grid; grid-template-columns:190px minmax(0,1.1fr) minmax(0,1fr); gap:20px; align-items:start; }
.nav{ position:sticky; top:calc(env(safe-area-inset-top,0px) + 14px); display:flex; flex-direction:column; gap:2px; }
.nav button{ display:flex; justify-content:space-between; align-items:center; gap:8px; text-align:start; background:transparent; border:0; border-radius:8px; padding:9px 12px; cursor:pointer; color:var(--muted); font-weight:500; }
.nav button:hover{ color:var(--ink); background:var(--panel-2); }
.nav button[aria-current="true"]{ background:var(--panel); color:var(--ink); box-shadow:inset -3px 0 0 var(--accent); }
.nav .count{ font-size:12px; min-width:22px; text-align:center; padding:0 6px; border-radius:20px; background:var(--panel-2); color:var(--muted); }
.nav button[aria-current="true"] .count{ background:var(--accent-soft); color:var(--accent); }

.editor{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:22px 24px 28px; min-height:60vh; }
.editor h2{ margin:0 0 4px; font-size:21px; }
.editor h3{ margin:26px 0 4px; font-size:16px; }
.editor .lead{ margin:0 0 18px; color:var(--muted); max-width:64ch; }
.editor .sublead{ margin:0 0 12px; color:var(--muted); font-size:14px; }

.fields{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px 16px; }
.field{ display:flex; flex-direction:column; gap:5px; min-width:0; }
.field.wide{ grid-column:1 / -1; }
.lab{ font-size:13px; font-weight:600; color:var(--muted); }
.hint{ font-size:12.5px; color:var(--muted); }
.inp{ width:100%; border:1px solid var(--line); background:var(--panel-2); border-radius:8px; padding:8px 10px; min-width:0; }
.inp:focus{ border-color:var(--accent); background:var(--panel); outline:none; box-shadow:0 0 0 3px var(--accent-soft); }
textarea.inp{ resize:vertical; min-height:70px; line-height:1.55; }
.ltr{ direction:ltr; text-align:left; }
.mono{ font-family:var(--mono); font-size:13px; }
.check{ display:flex; gap:9px; align-items:flex-start; cursor:pointer; padding:4px 0; }
.check input{ margin-top:5px; accent-color:var(--accent); width:16px; height:16px; flex:none; }
.check small{ display:block; color:var(--muted); font-size:12.5px; }

/* keycaps */
.hk{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.hk .inp{ width:120px; flex:none; }
.keycap{ background:none; border:1px dashed transparent; border-radius:10px; padding:4px 6px 8px; cursor:pointer; min-height:44px; }
.keycap:hover{ border-color:var(--line); }
.keycap.listening{ border-color:var(--accent); background:var(--accent-soft); }
.caps{ display:inline-flex; gap:5px; align-items:center; direction:ltr; }
.cap{ display:inline-block; min-width:32px; text-align:center; padding:5px 9px 6px; border-radius:7px; background:var(--key-top); color:var(--key-ink); border:1px solid var(--line); box-shadow:0 3px 0 var(--key-side); font:600 12.5px/1.2 var(--mono); }
.plus{ color:var(--muted); font-size:12px; }
.cap-empty{ color:var(--muted); font-size:13px; }
.cap-listen{ color:var(--accent); font-weight:600; font-size:13px; padding:6px 4px; display:inline-block; }

/* list rows */
.list{ display:flex; flex-direction:column; gap:10px; }
.row{ display:flex; gap:10px; align-items:flex-start; padding:12px; border:1px solid var(--line); border-radius:var(--radius); background:var(--panel); }
.row-fields{ flex:1; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px 12px; min-width:0; }
.row-ctl{ display:flex; flex-direction:column; gap:4px; }
.ib{ width:30px; height:30px; display:grid; place-items:center; border:1px solid var(--line); background:var(--panel-2); border-radius:7px; cursor:pointer; font-size:13px; color:var(--muted); }
.ib:hover:not(:disabled){ color:var(--ink); border-color:var(--accent); }
.ib.danger:hover:not(:disabled){ color:var(--danger); border-color:var(--danger); }
.ib:disabled{ opacity:.35; cursor:default; }
.add{ align-self:flex-start; border:1px dashed var(--line); background:transparent; border-radius:8px; padding:8px 14px; cursor:pointer; color:var(--accent); font-weight:600; }
.add:hover{ border-color:var(--accent); background:var(--accent-soft); }
.empty{ margin:0; color:var(--muted); font-size:14px; }

.group{ border:1px solid var(--line); border-radius:var(--radius); background:var(--panel-2); padding:14px; margin-bottom:14px; }
.group-head{ display:flex; gap:10px; align-items:flex-end; margin-bottom:12px; }
.group-head .field{ flex:1; }
.group-head .ctl{ display:flex; gap:4px; }

.tip{ margin-top:18px; padding:12px 14px; border-radius:8px; background:var(--panel-2); color:var(--muted); font-size:13.5px; border:1px solid var(--line); }
.tip code{ font-family:var(--mono); font-size:12.5px; background:var(--panel); padding:1px 5px; border-radius:4px; direction:ltr; display:inline-block; color:var(--ink); }
.fieldgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:2px 14px; }
.range-row{ display:flex; gap:10px; align-items:center; }
.range-row input[type=range]{ flex:1; accent-color:var(--accent); }
.range-row output{ font-family:var(--mono); font-size:13px; min-width:34px; }

/* ---------- Output panel ---------- */
.out{ position:sticky; top:calc(env(safe-area-inset-top,0px) + 14px); display:flex; flex-direction:column; height:calc(100dvh - 40px); min-height:480px; background:var(--code-bg); color:var(--code-ink); border-radius:var(--radius); overflow:hidden; }
.out-head{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 12px; border-bottom:1px solid rgba(255,255,255,.08); }
.tabs{ display:flex; gap:2px; background:rgba(255,255,255,.06); border-radius:8px; padding:3px; }
.tabs button{ border:0; background:transparent; color:var(--code-muted); padding:5px 12px; border-radius:6px; cursor:pointer; font-size:13.5px; font-weight:500; }
.tabs button[aria-selected="true"]{ background:rgba(255,255,255,.12); color:#fff; }
.out-actions{ margin-inline-start:auto; display:flex; gap:6px; flex-wrap:wrap; }
.out .btn{ background:rgba(255,255,255,.06); border-color:rgba(255,255,255,.12); color:var(--code-ink); }
.out .btn:hover{ border-color:#7896FF; }
.out .btn.primary{ background:#4B6FF0; border-color:#4B6FF0; color:#fff; }
.fname{ display:flex; align-items:center; gap:6px; padding:8px 12px; font-size:13px; color:var(--code-muted); border-bottom:1px solid rgba(255,255,255,.08); }
.fname input{ background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); color:#fff; border-radius:6px; padding:4px 8px; width:180px; direction:ltr; font-family:var(--mono); font-size:12.5px; }
.fname .stats{ margin-inline-start:auto; font-family:var(--mono); font-size:12px; }
.warns{ margin:0; padding:10px 14px 10px 14px; background:#3A2D0E; color:#F5D48B; font-size:13px; list-style:none; display:flex; flex-direction:column; gap:3px; max-height:130px; overflow:auto; }
.warns:empty{ display:none; }
.warns li::before{ content:"⚠ "; }
.code{ flex:1; overflow:auto; margin:0; padding:14px 16px 30px; direction:ltr; text-align:left; font:12.5px/1.65 var(--mono); tab-size:4; white-space:pre; }
.t-c{ color:#6F819C; font-style:italic; } .t-s{ color:#A8D89A; } .t-d{ color:#F28FAD; } .t-h{ color:#FFC56B; font-weight:600; } .t-k{ color:#C59CFF; } .t-f{ color:#79C0FF; }

.preview{ flex:1; overflow:auto; padding:24px 18px; background:
  radial-gradient(circle at 20% 10%, rgba(120,150,255,.18), transparent 40%),
  radial-gradient(circle at 80% 90%, rgba(60,200,180,.12), transparent 45%), #1A2436; }
.preview p{ margin:0 0 14px; color:#B7C3D6; font-size:13.5px; }
.ctx{ width:min(300px,100%); background:#F7F8FA; color:#1B1F26; border:1px solid #C9CED6; border-radius:8px; padding:4px; box-shadow:0 10px 30px rgba(0,0,0,.35); font-size:13.5px; }
.mi{ display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:5px; cursor:default; user-select:none; }
.mi:hover{ background:#DCE5FA; }
.mi .chk{ width:14px; flex:none; color:#2C57E0; font-weight:700; }
.mi .mt{ flex:1; } .mi .sfx{ color:#7A8394; direction:ltr; unicode-bidi:isolate; }
.mi .arr{ color:#7A8394; }
.sep{ height:1px; background:#D8DCE3; margin:4px 6px; }
.subbox{ margin:2px 22px 4px 4px; border-inline-start:2px solid #C9D3EA; padding-inline-start:4px; }

@media (max-width:1150px){
  .app{ grid-template-columns:1fr; }
  .nav{ position:static; flex-direction:row; overflow-x:auto; gap:4px; padding-bottom:2px; }
  .nav button{ flex:none; }
  .nav button[aria-current="true"]{ box-shadow:inset 0 -3px 0 var(--accent); }
  .out{ position:static; height:75vh; }
}
@media (max-width:640px){
  .top{ padding-top:18px; }
  .brand h1{ font-size:23px; }
  .editor{ padding:18px 14px 22px; }
  .fields,.row-fields{ grid-template-columns:1fr; }
  .row{ flex-direction:column; }
  .row-ctl{ flex-direction:row; align-self:flex-end; }
  .hero-key .cap{ font-size:16px; min-width:44px; padding:9px 12px 11px; }
}
@media (prefers-reduced-motion: no-preference){
  .keycap.listening .cap-listen{ animation:blink 1.1s ease-in-out infinite; }
  @keyframes blink{ 50%{ opacity:.45; } }
}
.ovprev-wrap{ padding:22px; border-radius:var(--radius); background:linear-gradient(135deg,#27496d 0%,#3d3a6b 55%,#1f5c63 100%); overflow-x:auto; }
.ovprev{ margin:0; display:inline-block; background:rgba(0,0,0,.35); padding:8px 10px; border-radius:4px; line-height:1.3; white-space:pre; text-align:left; }
.screen{ position:relative; width:100%; max-width:540px; aspect-ratio:16/9; border:7px solid #1C2230; border-radius:9px; overflow:hidden; direction:ltr; touch-action:none;
  background:linear-gradient(135deg,#27496d 0%,#3d3a6b 55%,#1f5c63 100%); }
.screen .task{ position:absolute; left:0; right:0; bottom:0; height:4.4%; background:rgba(14,18,26,.9); }
.ov-block{ position:absolute; border:1.5px solid rgba(255,255,255,.9); border-radius:3px; cursor:grab; touch-action:none;
  background:repeating-linear-gradient(to bottom, rgba(255,255,255,.55) 0 1px, transparent 1px 5px), rgba(0,0,0,.45); background-clip:padding-box; }
.ov-block:active{ cursor:grabbing; }
.ov-block:focus-visible{ outline:2px solid #FFC56B; outline-offset:2px; }
.corners{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.corners .btn{ font-size:13px; padding:5px 10px; }
.ovorder{ display:flex; flex-direction:column; gap:4px; max-width:520px; }
.ovrow{ display:flex; align-items:center; gap:8px; padding:5px 8px; border:1px solid var(--line); border-radius:8px; background:var(--panel); }
.ovrow.off{ opacity:.55; }
.ovrow input{ accent-color:var(--accent); width:16px; height:16px; }
.ovname{ flex:1; cursor:pointer; display:flex; justify-content:space-between; gap:10px; }
.ovname .ven{ font-family:var(--mono); font-size:12.5px; color:var(--muted); direction:ltr; }
.ovrow .ib{ width:26px; height:26px; }
.report{ position:relative; border:1px solid var(--line); border-inline-start:4px solid var(--accent); background:var(--accent-soft); border-radius:8px; padding:12px 14px 12px 44px; margin-bottom:18px; font-size:14px; }
.report.ok{ border-inline-start-color:#2E9E6A; }
.report p{ margin:6px 0 0; }
.report .ib{ position:absolute; top:8px; left:8px; }
.report details{ margin-top:6px; } .report summary{ cursor:pointer; color:var(--muted); }
.report ul{ margin:6px 0 0; padding-inline-start:20px; font-size:13px; direction:rtl; }
/* ---------- LTR fixes ---------- */
[dir="ltr"] .nav button[aria-current="true"]{ box-shadow:inset 3px 0 0 var(--accent); }
.report{ padding:12px 14px; padding-inline-end:44px; }
.report .ib{ left:auto; inset-inline-end:8px; }
.report ul{ direction:inherit; }
.subbox{ margin:2px 0 4px; margin-inline-start:22px; margin-inline-end:4px; border-inline-start:2px solid #C9D3EA; }
@media (max-width:1150px){ [dir="ltr"] .nav button[aria-current="true"]{ box-shadow:inset 0 -3px 0 var(--accent); } }

/* ---------- Wizard ---------- */
body.wiz-open{ overflow:hidden; }
.wiz-back{ position:fixed; inset:0; z-index:30; background:rgba(8,12,20,.55); backdrop-filter:blur(3px); display:grid; place-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px); }
.wiz-back[hidden]{ display:none; }
.wiz{ position:relative; width:min(880px,100%); max-height:100%; overflow:auto; background:var(--panel); color:var(--ink); border-radius:16px;
  box-shadow:0 30px 80px rgba(0,0,0,.35); display:flex; flex-direction:column; }
.wz-close{ position:absolute; top:14px; inset-inline-end:14px; z-index:2; }
.wz-body{ padding:30px 34px 24px; flex:1; }
.wz-body h2{ margin:0 0 6px; font-size:25px; line-height:1.3; outline:none; }
.wz-body h3{ margin:22px 0 10px; font-size:15px; color:var(--muted); }
.wz-body .lead{ margin:0 0 20px; color:var(--muted); font-size:16px; }
.wz-steps{ list-style:none; margin:0; padding:22px 34px 0; padding-inline-end:64px; display:flex; gap:6px; }
.wz-steps li{ flex:1; display:flex; flex-direction:column; gap:6px; font-size:12.5px; color:var(--muted); }
.wz-steps li::before{ content:""; height:4px; border-radius:4px; background:var(--line); order:-1; }
.wz-steps li.done::before, .wz-steps li.now::before{ background:var(--accent); }
.wz-steps li.now{ color:var(--ink); font-weight:600; }
.wz-steps .dot{ display:none; }
.wz-foot{ position:sticky; bottom:0; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 34px; border-top:1px solid var(--line); background:var(--panel); }
.wz-count{ color:var(--muted); font-size:14px; }
.btn.big{ padding:11px 22px; font-size:15.5px; font-weight:600; border-radius:10px; }
.btn.wide{ width:100%; justify-content:center; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.linkbtn{ background:none; border:0; color:var(--accent); cursor:pointer; padding:6px 2px; font-weight:500; text-decoration:underline; text-underline-offset:3px; }
.wz-actions{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:22px; }

.wz-welcome{ display:grid; grid-template-columns:1.05fr 1fr; gap:30px; align-items:center; }
.wz-points{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; font-size:16px; }
.wz-points li{ display:flex; gap:10px; align-items:baseline; }

.demo{ position:relative; aspect-ratio:16/11; border-radius:12px; overflow:hidden; direction:ltr; border:6px solid #1C2230;
  background:linear-gradient(135deg,#27496d 0%,#3d3a6b 55%,#1f5c63 100%); }
.demo-menu{ position:absolute; left:30%; top:12%; width:46%; background:#F7F8FA; color:#1B1F26; border-radius:7px; padding:4px;
  box-shadow:0 10px 24px rgba(0,0,0,.35); font-size:clamp(10px,1.5vw,13px); transform-origin:top left; animation:dmenu 6s infinite; }
.demo-menu div{ padding:5px 8px; border-radius:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.demo-menu div:first-child{ animation:dhl 6s infinite; }
.demo-key{ position:absolute; left:50%; bottom:9%; transform:translateX(-50%); }
.demo-key .cap{ font-size:17px; padding:9px 15px 11px; animation:dkey 6s infinite; }
.demo-win{ position:absolute; inset:9% 10% 12% 10%; background:#fff; border-radius:6px; overflow:hidden; opacity:0; animation:dwin 6s infinite; display:flex; flex-direction:column; }
.demo-bar{ height:14%; background:#E6E9EF; }
.demo-yt{ margin:auto; width:26%; aspect-ratio:1.45; background:#E62117; color:#fff; border-radius:10px; display:grid; place-items:center; font-size:20px; }
@keyframes dkey{ 0%,12%{ transform:none; box-shadow:0 3px 0 var(--key-side); } 15%{ transform:translateY(3px); box-shadow:0 0 0 var(--key-side); } 19%,100%{ transform:none; box-shadow:0 3px 0 var(--key-side); } }
@keyframes dmenu{ 0%,15%{ opacity:0; transform:scale(.92); } 19%,58%{ opacity:1; transform:none; } 63%,100%{ opacity:0; transform:scale(.97); } }
@keyframes dhl{ 0%,34%{ background:transparent; } 38%,58%{ background:#DCE5FA; } }
@keyframes dwin{ 0%,60%{ opacity:0; transform:scale(.96); } 66%,90%{ opacity:1; transform:none; } 96%,100%{ opacity:0; } }
@media (prefers-reduced-motion: reduce){
  .demo-menu,.demo-menu div:first-child,.demo-key .cap,.demo-win{ animation:none; }
  .demo-menu{ opacity:1; } .demo-win{ display:none; }
}

.wz-personas{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
.persona{ display:flex; flex-direction:column; align-items:flex-start; gap:4px; text-align:start; padding:16px; border:1.5px solid var(--line); border-radius:12px; background:var(--panel-2); cursor:pointer; }
.persona:hover{ border-color:var(--accent); }
.persona[aria-checked="true"]{ border-color:var(--accent); background:var(--accent-soft); box-shadow:0 0 0 3px var(--accent-soft); }
.persona .pe{ font-size:30px; line-height:1.1; }
.persona .pt{ font-weight:700; font-size:16px; }
.persona .pd{ color:var(--muted); font-size:13px; }

/* ---------- حواف حادة في كل مكان ---------- */
*, *::before, *::after { border-radius:0 !important; }
.foot{ max-width:1320px; margin:0 auto; padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 30px); display:flex; flex-wrap:wrap; gap:6px 18px; font-size:13px; color:var(--muted); }
.foot a{ color:var(--accent); }
.foot .muted{ margin-inline-start:auto; }
/* =====================================================================
   WINDOWS 95 THEME
   ===================================================================== */
:root{
  --w-face:#C0C0C0; --w-light:#FFFFFF; --w-hi:#DFDFDF; --w-shadow:#808080; --w-dark:#000000;
  --w-desk:#008080; --w-title1:#000080; --w-title2:#1084D0; --w-titleink:#FFFFFF;
  --w-sel:#000080; --w-selink:#FFFFFF; --w-text:#000000; --w-window:#FFFFFF; --w-muted:#404040;
  --w-tip:#FFFFE1; --w-link:#0000EE; --w-warn:#FFFFE1;
  --w-font: Tahoma, "MS Sans Serif", "Noto Sans Arabic", "Segoe UI", sans-serif;
  --w-mono: "Courier New", Courier, "Lucida Console", monospace;
  /* map the old tokens so every existing component follows */
  --bg:var(--w-face); --panel:var(--w-face); --panel-2:var(--w-face); --ink:var(--w-text); --muted:var(--w-muted);
  --line:var(--w-shadow); --accent:var(--w-sel); --accent-ink:var(--w-selink); --accent-soft:var(--w-hi);
  --danger:#A00000; --warn-bg:var(--w-warn); --warn-ink:#000;
  --key-top:var(--w-face); --key-side:var(--w-dark); --key-ink:var(--w-text);
  --code-bg:var(--w-window); --code-ink:var(--w-text);
  --ui:var(--w-font); --mono:var(--w-mono);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --w-face:#000000; --w-light:#FFFFFF; --w-hi:#C0C0C0; --w-shadow:#808080; --w-dark:#FFFFFF;
    --w-desk:#000000; --w-title1:#800080; --w-title2:#800080; --w-sel:#800080; --w-selink:#FFFFFF;
    --w-text:#FFFFFF; --w-window:#000000; --w-muted:#C0C0C0; --w-tip:#000000; --w-link:#FFFF00; --w-warn:#000000;
    --warn-ink:#FFFF00; --danger:#FF6060;
  }
}
:root[data-theme="dark"]{
  --w-face:#000000; --w-light:#FFFFFF; --w-hi:#C0C0C0; --w-shadow:#808080; --w-dark:#FFFFFF;
  --w-desk:#000000; --w-title1:#800080; --w-title2:#800080; --w-sel:#800080; --w-selink:#FFFFFF;
  --w-text:#FFFFFF; --w-window:#000000; --w-muted:#C0C0C0; --w-tip:#000000; --w-link:#FFFF00; --w-warn:#000000;
  --warn-ink:#FFFF00; --danger:#FF6060;
}

body{ background:var(--w-desk); color:var(--w-text); font:13px/1.5 var(--w-font); -webkit-font-smoothing:auto;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 44px); }
::selection{ background:var(--w-sel); color:var(--w-selink); }
a{ color:var(--w-link); }
:focus-visible{ outline:1px dotted var(--w-text); outline-offset:-4px; }

/* scrollbars */
*{ scrollbar-color:var(--w-shadow) var(--w-hi); }
::-webkit-scrollbar{ width:16px; height:16px; }
::-webkit-scrollbar-track{ background:repeating-conic-gradient(var(--w-face) 0 25%, var(--w-light) 0 50%) 0 0/2px 2px; }
::-webkit-scrollbar-thumb{ background:var(--w-face); border:2px solid; border-color:var(--w-light) var(--w-dark) var(--w-dark) var(--w-light); box-shadow:inset -1px -1px var(--w-shadow), inset 1px 1px var(--w-hi); }
::-webkit-scrollbar-corner{ background:var(--w-face); }

/* ---------- bevel primitives ---------- */
.btn, .ib, .add, .chip, .tab2, .keyopt, .persona, .emo-btn, .warnbtn, .seg button, .m95-btn, .start, .task, .tray-btn,
.tchip button, .corners .btn, .keycap .cap, .cap, .fab, .opts button{
  background:var(--w-face); color:var(--w-text); font:13px var(--w-font);
  border:2px solid; border-color:var(--w-light) var(--w-dark) var(--w-dark) var(--w-light);
  box-shadow:inset -1px -1px var(--w-shadow), inset 1px 1px var(--w-hi);
}
.btn:active, .ib:active:not(:disabled), .add:active, .chip:active, .keyopt:active, .persona:active, .emo-btn:active, .seg button:active, .start:active, .task.active,
.chip[aria-pressed="true"], .keyopt[aria-checked="true"], .persona[aria-checked="true"], .seg button[aria-selected="true"], .start[aria-expanded="true"]{
  border-color:var(--w-dark) var(--w-light) var(--w-light) var(--w-dark);
  box-shadow:inset 1px 1px var(--w-shadow), inset -1px -1px var(--w-hi);
}
.inp, .mtitle:focus, textarea.inp, select.inp, .side .fname input, .fname input, .prev-stage, .code, .mlist, .ovprev-wrap, .screen, .warnlist, .emo-pop{
  background:var(--w-window); color:var(--w-text);
  border:2px solid; border-color:var(--w-shadow) var(--w-light) var(--w-light) var(--w-shadow);
  box-shadow:inset 1px 1px var(--w-dark), inset -1px -1px var(--w-hi);
}

/* buttons */
.btn{ padding:4px 14px; min-height:26px; font-weight:400; cursor:pointer; }
.btn:hover, .chip:hover, .ib:hover:not(:disabled), .keyopt:hover, .persona:hover{ border-color:var(--w-light) var(--w-dark) var(--w-dark) var(--w-light); }
.btn.primary{ background:var(--w-face); color:var(--w-text); border-color:var(--w-light) var(--w-dark) var(--w-dark) var(--w-light); outline:1px solid var(--w-dark); outline-offset:-6px; font-weight:700; }
.btn.primary:hover{ filter:none; }
.btn.ghost{ background:var(--w-face); }
.btn.big{ padding:7px 20px; font-size:14px; }
.btn.small{ padding:2px 10px; font-size:12.5px; min-height:22px; }

<script>
/* ============================================================
   إعدادات المنتج (عدّلها قبل البيع)
   ============================================================ */
/* ============================================================
   إعدادات البائع — عدّلها قبل البيع
   ============================================================ */
const BRAND = {
  ar: 'صانع المنظّم',           // اسم المنتج بالعربي
  en: 'Organizer Maker',         // اسم المنتج بالإنجليزي
  version: '1.1',
  support: '',                   // رابط الدعم (واتساب، إيميل mailto:، تويتر…) — يظهر أسفل الصفحة لو عبّيته
  store: '',                     // رابط متجرك — يظهر أسفل الصفحة لو عبّيته
  owner: '',                     // اسمك أو اسم متجرك — يظهر أسفل الصفحة
};

/* اللغة */
const LANG_KEY = 'ahk-organizer-builder:lang';
let LANG = (() => { try { const v = localStorage.getItem(LANG_KEY); if (v === 'ar' || v === 'en') return v; } catch {} return /^ar/i.test(navigator.language || 'ar') ? 'ar' : 'en'; })();
const L = (ar, en) => LANG === 'en' ? en : ar;
const brandName = () => L(BRAND.ar, BRAND.en);

/* ============================================================
   أدوات عامة
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
let uid = 0;
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (['value', 'checked', 'disabled', 'hidden', 'type'].includes(k)) el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return el;
}
const clone = o => JSON.parse(JSON.stringify(o));
const one = s => String(s ?? '').replace(/[\r\n]+/g, ' ').trim();
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ============================================================
   القوالب
   ============================================================ */
/* الشريط العائم: كل معلومة بالإنجليزي، مع ترتيب يختاره المستخدم */
const OV = {
  date:       { ar: 'التاريخ',        en: 'Date',       icon: '📅', sample: 'Wed, 23 Sep 2026' },
  time:       { ar: 'الوقت',          en: 'Time',       icon: '🕒', sample: '14:05:33' },
  hijri:      { ar: 'التاريخ الهجري', en: 'Hijri',      icon: '🌙', sample: '11 Rabi II 1448' },
  uptime:     { ar: 'مدة التشغيل',    en: 'Uptime',     icon: '⏳', sample: '01:22:10' },
  battery:    { ar: 'البطارية',       en: 'Battery',    icon: '🔋', sample: '85% (plugged in)' },
  volume:     { ar: 'الصوت',          en: 'Volume',     icon: '🔊', sample: '40%' },
  mic:        { ar: 'المايك',         en: 'Mic',        icon: '🎤', sample: 'On' },
  lang:       { ar: 'لغة الكيبورد',   en: 'Keyboard',   icon: '🌐', sample: 'EN' },
  caps:       { ar: 'Caps Lock',      en: 'Caps Lock',  icon: '🔠', sample: 'OFF' },
  num:        { ar: 'Num Lock',       en: 'Num Lock',   icon: '🔢', sample: 'ON' },
  brightness: { ar: 'الإضاءة',        en: 'Brightness', icon: '☀️', sample: '70%' },
  disk:       { ar: 'مساحة القرص C',  en: 'Disk C',    icon: '💾', sample: '120.5 GB free' },
  clipboard:  { ar: 'آخر نص منسوخ',   en: 'Clipboard',  icon: '📋', sample: 'https://example.com/page' },
};
const OV_KEYS = Object.keys(OV);
const allFields = v => Object.fromEntries(OV_KEYS.map(k => [k, v]));

function makeBase() { return {
  v: 2, title: L('منظّمي', 'My Organizer'), author: '',
  menuKey: 'F9', menuWildcard: true,
  browserPath: 'C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe',
  startup: { enabled: true, text: L('تم تشغيل المنظّم ✅', 'Organizer is running ✅') },
  notify: true,
  scripts: [], submenus: [],
  extras: { reload: true, edit: false, exit: false, close: true, startup: true },
  tray: true, custom: '',
  media: { enabled: false, next: '!Right', prev: '!Left', play: '!s' },
  groups: [], snippets: [],
  overlay: {
    enabled: false, px: 0, py: 1, font: 'Consolas', fontSize: 10, color: '#FFFFFF', opacity: 210, width: 400,
    toggleKey: '^+o', interval: 1000, clipMax: 40, icons: false, time24: true,
    order: OV_KEYS.slice(), fields: Object.assign(allFields(true), { mic: false, num: false }),
  },
}; }

function makePresets() { return {
  empty: clone(makeBase()),
  example: Object.assign(clone(makeBase()), {
    title: L('منظّمي', 'My Organizer'),
    submenus: [
      { title: L('🌐 مواقعي', '🌐 My websites'), items: [
        { label: '▶️ YouTube', target: 'https://www.youtube.com/' },
        { label: '✉️ Gmail', target: 'https://mail.google.com/' },
        { label: '📂 Google Drive', target: 'https://drive.google.com/' },
        { label: '🔤 Google Translate', target: 'https://translate.google.com/' },
      ]},
      { title: L('💻 برامجي', '💻 My apps'), items: [
        { label: L('📝 المفكرة', '📝 Notepad'), target: 'notepad.exe' },
        { label: L('🧮 الحاسبة', '🧮 Calculator'), target: 'calc.exe' },
        { label: L('📁 مستكشف الملفات', '📁 File Explorer'), target: 'explorer.exe' },
        { label: L('📊 مدير المهام', '📊 Task Manager'), target: 'taskmgr.exe' },
      ]},
      { title: L('🎵 الموسيقى', '🎵 Music'), items: [
        { label: '🎧 Spotify', target: 'https://open.spotify.com/' },
        { label: '☁️ SoundCloud', target: 'https://soundcloud.com/discover' },
        { label: '🎵 YouTube Music', target: 'https://music.youtube.com/' },
      ]},
    ],
    media: { enabled: true, next: '!Right', prev: '!Left', play: '!s' },
    groups: [{ kind: 'hotstring', trigger: 'work///', newWindow: true,
      targets: ['https://mail.google.com/', 'https://calendar.google.com/', 'https://drive.google.com/'].join('\n') }],
    snippets: [{ kind: 'hotstring', trigger: 'sig///', instant: true, pre: '', text: L('مع خالص التحية،\nاسمك هنا', 'Best regards,\nYour name') }],
    overlay: Object.assign(clone(makeBase().overlay), { enabled: true }),
  }),
}; }

function normalize(o) {
  const s = Object.assign(clone(makeBase()), o || {});
  s.startup = Object.assign(clone(makeBase().startup), s.startup || {});
  s.extras = Object.assign(clone(makeBase().extras), s.extras || {});
  s.media = Object.assign(clone(makeBase().media), s.media || {});
  const src = (o && o.overlay) || {};
  const ov = Object.assign(clone(makeBase().overlay), src);
  // ترقية ملفات الإعدادات القديمة
  if (src.corner && src.px == null) { ov.px = src.corner.endsWith('r') ? 1 : 0; ov.py = src.corner.startsWith('b') ? 1 : 0; }
  const f = Object.assign({}, src.fields || {});
  if ('dateText' in f) f.date = f.dateText;
  if ('dateNum' in f) f.time = f.dateNum;
  ov.fields = src.fields ? Object.assign(allFields(false), f) : clone(makeBase().overlay.fields);
  const order = Array.isArray(src.order) ? src.order.filter(k => OV_KEYS.includes(k)) : [];
  ov.order = order.concat(OV_KEYS.filter(k => !order.includes(k)));
  ov.px = Math.min(1, Math.max(0, Number(ov.px) || 0));
  ov.py = Math.min(1, Math.max(0, Number(ov.py) || 0));
  s.overlay = ov;
  for (const k of ['scripts', 'submenus', 'groups', 'snippets']) if (!Array.isArray(s[k])) s[k] = [];
  const str = v => (v == null ? '' : String(v));
  s.scripts = s.scripts.filter(x => x && typeof x === 'object').map(x => ({ label: str(x.label), suffix: str(x.suffix), path: str(x.path) }));
  s.submenus = s.submenus.filter(m => m && typeof m === 'object').map(m => ({ title: str(m.title),
    items: (Array.isArray(m.items) ? m.items : []).filter(i => i && typeof i === 'object').map(i => ({ label: str(i.label), target: str(i.target) })) }));
  const kind = v => v === 'hotkey' ? 'hotkey' : 'hotstring';
  s.groups = s.groups.filter(g => g && typeof g === 'object').map(g => ({ kind: kind(g.kind), trigger: str(g.trigger), newWindow: g.newWindow !== false, targets: Array.isArray(g.targets) ? g.targets.join('\n') : str(g.targets) }));
  s.snippets = s.snippets.filter(x => x && typeof x === 'object').map(x => ({ kind: kind(x.kind), trigger: str(x.trigger), instant: true, pre: str(x.pre), text: str(x.text) }));
  ['title', 'author', 'menuKey', 'browserPath'].forEach(k => { s[k] = str(s[k]); });
  if (!s.menuKey.trim()) s.menuKey = 'F9';
  if (typeof s.custom !== 'string') s.custom = '';
  s.tray = s.tray !== false;
  s.submenus.forEach(m => { if (!Array.isArray(m.items)) m.items = []; });
  return s;
}

/* ============================================================
   الحفظ التلقائي
   ============================================================ */
const STORE = 'ahk-organizer-builder:v2';
function loadDraft() { try { const r = localStorage.getItem(STORE); return r ? normalize(JSON.parse(r)) : null; } catch { return null; } }
function saveDraft() { try { localStorage.setItem(STORE, JSON.stringify({ state: S, file: $('#fileName').value })); } catch {} }
let S;
{
  let d = null;
  try { const r = localStorage.getItem(STORE); if (r) d = JSON.parse(r); } catch {}
  S = d && d.state ? normalize(d.state) : normalize(clone(makePresets().example));
  if (d && d.file) $('#fileName').value = d.file;
}

/* ============================================================
   الاختصارات: تحويل وعرض
   ============================================================ */
const CODE_MAP = {
  ArrowLeft: 'Left', ArrowRight: 'Right', ArrowUp: 'Up', ArrowDown: 'Down', Space: 'Space', Enter: 'Enter', Tab: 'Tab',
  Escape: 'Esc', Backspace: 'Backspace', Delete: 'Delete', Insert: 'Insert', Home: 'Home', End: 'End', PageUp: 'PgUp', PageDown: 'PgDn',
  Minus: '-', Equal: '=', BracketLeft: '[', BracketRight: ']', Backslash: '\\', Semicolon: '`;', Quote: "'", Comma: ',', Period: '.', Slash: '/',
  Backquote: 'SC029', NumpadAdd: 'NumpadAdd', NumpadSubtract: 'NumpadSub', NumpadMultiply: 'NumpadMult', NumpadDivide: 'NumpadDiv',
  NumpadEnter: 'NumpadEnter', NumpadDecimal: 'NumpadDot', Pause: 'Pause', PrintScreen: 'PrintScreen', ScrollLock: 'ScrollLock',
  CapsLock: 'CapsLock', ContextMenu: 'AppsKey', MediaPlayPause: 'Media_Play_Pause', MediaTrackNext: 'Media_Next', MediaTrackPrevious: 'Media_Prev',
};
function codeToAhk(code) {
  if (/^Key[A-Z]$/.test(code)) return code.slice(3).toLowerCase();
  if (/^Digit\d$/.test(code)) return code.slice(5);
  if (/^F\d{1,2}$/.test(code)) return code;
  if (/^Numpad\d$/.test(code)) return code;
  return CODE_MAP[code] || null;
}
const KEY_PRETTY = { Left: '←', Right: '→', Up: '↑', Down: '↓', '`;': ';', SC029: '`', PgUp: 'Page Up', PgDn: 'Page Down', Esc: 'Esc' };
function parseHotkey(hk) {
  const m = String(hk || '').trim().match(/^([*~$]*)([\^!+#<>]*)(.*)$/);
  if (!m) return null;
  const mods = m[2].replace(/[<>]/g, '');
  return { prefix: m[1], mods, key: m[3] };
}
function renderCaps(hk) {
  const p = parseHotkey(hk);
  if (!p || !p.key) return [h('span', { class: 'cap-empty', text: L('اضغط لتسجيل اختصار', 'Click to record a shortcut') })];
  const names = [];
  if (p.mods.includes('^')) names.push('Ctrl');
  if (p.mods.includes('!')) names.push('Alt');
  if (p.mods.includes('+')) names.push('Shift');
  if (p.mods.includes('#')) names.push('Win');
  let k = KEY_PRETTY[p.key] || (p.key.length === 1 ? p.key.toUpperCase() : p.key);
  names.push(k);
  const wrap = h('span', { class: 'caps' });
  names.forEach((n, i) => { if (i) wrap.append(h('span', { class: 'plus', text: '+' })); wrap.append(h('span', { class: 'cap', text: n })); });
  return [wrap];
}
function prettyHotkey(hk) {
  const p = parseHotkey(hk); if (!p || !p.key) return '';
  const n = [];
  if (p.mods.includes('^')) n.push('Ctrl'); if (p.mods.includes('!')) n.push('Alt');
  if (p.mods.includes('+')) n.push('Shift'); if (p.mods.includes('#')) n.push('Win');
  n.push(KEY_PRETTY[p.key] || (p.key.length === 1 ? p.key.toUpperCase() : p.key));
  return n.join(' + ');
}

/* ============================================================
   عناصر الإدخال
   ============================================================ */
function textField(label, obj, key, o = {}) {
  const id = 'f' + (++uid);
  const tag = o.multiline ? 'textarea' : 'input';
  const input = h(tag, { id, class: 'inp' + (o.ltr ? ' ltr mono' : ''), placeholder: o.placeholder || '', dir: o.ltr ? 'ltr' : null,
    rows: o.multiline ? (o.rows || 3) : null, type: o.type || null, min: o.min ?? null, max: o.max ?? null,
    oninput: e => { obj[key] = o.type === 'number' ? Number(e.target.value) : e.target.value; changed(); o.onInput && o.onInput(); } });
  input.value = obj[key] ?? '';
  return h('div', { class: 'field' + (o.wide ? ' wide' : '') },
    h('label', { class: 'lab', for: id, text: label }), input,
    o.hint ? h('small', { class: 'hint', text: o.hint }) : null);
}
function checkField(label, obj, key, o = {}) {
  const input = h('input', { type: 'checkbox', checked: !!obj[key], onchange: e => { obj[key] = e.target.checked; changed(); o.onChange && o.onChange(); } });
  return h('label', { class: 'check' + (o.wide ? ' field wide' : '') }, input, h('span', {}, label, o.hint ? h('small', { text: o.hint }) : null));
}
function selectField(label, obj, key, options, o = {}) {
  const id = 'f' + (++uid);
  const sel = h('select', { id, class: 'inp', onchange: e => { obj[key] = e.target.value; changed(); o.onChange && o.onChange(); } },
    options.map(([v, t]) => h('option', { value: v, text: t })));
  sel.value = obj[key];
  return h('div', { class: 'field' + (o.wide ? ' wide' : '') }, h('label', { class: 'lab', for: id, text: label }), sel);
}
const WORD_MODS = { ctrl: '^', control: '^', ctl: '^', 'كنترول': '^', alt: '!', 'التر': '!', 'ألت': '!', shift: '+', 'شفت': '+', win: '#', windows: '#', 'وين': '#' };
const WORD_KEYS = { space: 'Space', enter: 'Enter', return: 'Enter', tab: 'Tab', esc: 'Esc', escape: 'Esc', backspace: 'Backspace', delete: 'Delete', del: 'Delete',
  insert: 'Insert', ins: 'Insert', home: 'Home', end: 'End', pgup: 'PgUp', pageup: 'PgUp', pgdn: 'PgDn', pagedown: 'PgDn', left: 'Left', right: 'Right', up: 'Up', down: 'Down',
  '←': 'Left', '→': 'Right', '↑': 'Up', '↓': 'Down' };
function humanHotkey(v) {
  v = String(v || '').trim();
  const parts = v.split(/\s*\+\s*/).filter(Boolean);
  if (parts.length < 2 || !parts.some(p => WORD_MODS[p.toLowerCase()])) return v;
  let mods = '', key = '';
  for (const p of parts) {
    const m = WORD_MODS[p.toLowerCase()];
    if (m) { if (!mods.includes(m)) mods += m; } else key = p;
  }
  if (!key) return v;
  const kl = key.toLowerCase();
  key = WORD_KEYS[kl] || (/^f\d{1,2}$/i.test(key) ? key.toUpperCase() : key.length === 1 ? kl : key);
  return mods + key;
}
const VALID_KEYS = new Set(['space', 'enter', 'tab', 'esc', 'escape', 'backspace', 'delete', 'del', 'insert', 'ins', 'home', 'end', 'pgup', 'pgdn', 'left', 'right', 'up', 'down',
  'capslock', 'numlock', 'scrolllock', 'printscreen', 'pause', 'appskey', 'lbutton', 'rbutton', 'mbutton', 'xbutton1', 'xbutton2', 'wheelup', 'wheeldown', 'wheelleft', 'wheelright',
  'numpadadd', 'numpadsub', 'numpadmult', 'numpaddiv', 'numpadenter', 'numpaddot', 'media_next', 'media_prev', 'media_play_pause', 'media_stop', 'volume_up', 'volume_down', 'volume_mute',
  'browser_back', 'browser_forward', 'browser_home', 'launch_mail', 'launch_app1', 'launch_app2', 'lwin', 'rwin', 'lctrl', 'rctrl', 'lalt', 'ralt', 'lshift', 'rshift']);
function hotkeyValid(hk) {
  const p = parseHotkey(hk); if (!p || !p.key) return false;
  const k = p.key.trim();
  if (/\s&\s/.test(k)) return k.split(/\s&\s/).every(x => hotkeyValid(x.trim()));
  return k.length === 1 || k === '`;' || /^F([1-9]|1\d|2[0-4])$/i.test(k) || /^Numpad\d$/i.test(k) || /^(SC|VK)[0-9A-F]+$/i.test(k) || VALID_KEYS.has(k.toLowerCase());
}
function hotkeyField(label, obj, key, o = {}) {
  let listening = false, lastSet = 0;
  const raw = h('input', { class: 'inp ltr mono', dir: 'ltr', 'aria-label': label + L(' بصيغة AutoHotkey', ' in AutoHotkey format'), title: L('صيغة AutoHotkey — يمكنك تعديلها يدوياً', 'AutoHotkey format — you can edit it by hand'),
    oninput: e => { obj[key] = e.target.value.trim(); paint(); changed(); } });
  raw.value = obj[key] || '';
  raw.addEventListener('change', () => { const n = humanHotkey(raw.value); if (n !== raw.value) { raw.value = n; obj[key] = n; paint(); changed(); } if (o.onChange) setTimeout(o.onChange, 0); });
  raw.placeholder = 'Ctrl+Alt+M';
  const cap = h('button', { type: 'button', class: 'keycap', 'aria-label': label + L(': اضغط ثم اضغط الاختصار المطلوب', ': click, then press the shortcut you want'),
    onclick: () => { if (Date.now() - lastSet < 400) return; listening = true; paint(); } });
  function paint() {
    cap.classList.toggle('listening', listening);
    cap.replaceChildren(...(listening ? [h('span', { class: 'cap-listen', text: L('اضغط الاختصار الآن… (Esc للإلغاء)', 'Press the shortcut now… (Esc to cancel)') })] : renderCaps(obj[key])));
  }
  cap.addEventListener('keydown', e => {
    if (!listening) return;
    e.preventDefault(); e.stopPropagation();
    const noMods = !(e.ctrlKey || e.altKey || e.shiftKey || e.metaKey);
    if (e.code === 'Escape' && noMods) { listening = false; paint(); return; }
    const k = codeToAhk(e.code); if (!k) return;
    let m = ''; if (e.ctrlKey) m += '^'; if (e.altKey) m += '!'; if (e.shiftKey) m += '+'; if (e.metaKey) m += '#';
    obj[key] = m + k; raw.value = obj[key]; listening = false; lastSet = Date.now(); paint(); changed(); if (o.onChange) setTimeout(o.onChange, 0);
  });

    else { const t = code[ti].trim(); const close = matchParen(t, t.indexOf('(')); if (close > 0) txt = evalExpr(splitArgs(t.slice(t.indexOf('(') + 1, close))[0], vars); }
    if (txt != null) {
      const lines = txt.split('\n').map(l => l.trim()).filter(l => l && !/^[┏┗┓┛━┃\s]+$/.test(l) && !/للقائمة|for the menu/.test(l));
      s.startup = { enabled: true, text: lines[0] || L('تم تشغيل المنظّم ✅', 'Organizer is running ✅') };
    }
  }

  // ---------- القوائم ----------
  const menus = {}, menuOrder = [];
  const scriptItems = [];
  top.forEach(i => {
    if (cont[i]) return;
    const t = code[i].trim(); let m;
    if ((m = t.match(/^(?:global\s+)?(\w+)\s*:=\s*Menu\(\)/))) { menus[m[1]] = []; menuOrder.push(m[1]); return; }
    if ((m = t.match(/^A_TrayMenu\.Add\(/))) { s.tray = true; return; }
    if (!(m = t.match(/^(\w+)\.Add\(/)) || !menus[m[1]]) return;
    const open = t.indexOf('('); const close = matchParen(t, open); if (close < 0) return;
    const args = splitArgs(t.slice(open + 1, close));
    const list = menus[m[1]];
    if (!args.length || (args.length === 1 && !args[0])) { list.push({ sep: true }); return; }
    const label = evalExpr(args[0], vars);
    const a1 = (args[1] || '').trim();
    if (label == null) { if (!/^s\.Name$/.test(args[0])) R.skipped.push(L('عنصر قائمة اسمه غير مفهوم: ', 'Menu item with an unreadable name: ') + args[0]); return; }
    if (menus[a1] || menuOrder.includes(a1)) { list.push({ label, sub: a1 }); return; }
    if (a1 === 'ToggleStartup') { list.push({ label, extra: 'startup' }); return; }
    const lam = a1.match(/^\(\s*\*\s*\)\s*=>\s*(.*)$/);
    if (!lam) { R.skipped.push(L('عنصر "', 'Item "') + label + L('" ما قدرت أفهم وش يسوي', '": couldn\'t tell what it does')); return; }
    const body = lam[1].trim();
    if (body === '""' || body === "''") { list.push({ label, extra: 'close' }); return; }
    const cm = body.match(/^(\w+)\(/);
    if (!cm) { list.push({ label, unknown: body }); return; }
    const cclose = matchParen(body, body.indexOf('('));
    const cargs = splitArgs(body.slice(body.indexOf('(') + 1, cclose));
    const fn = cm[1];
    if (fn === 'Reload') list.push({ label, extra: 'reload' });
    else if (fn === 'Edit') list.push({ label, extra: 'edit' });
    else if (fn === 'ExitApp') list.push({ label, extra: 'exit' });
    else if (/^(OpenURL|OpenTarget|OpenApp|OpenPlaylist|Run)$/.test(fn)) {
      const tg = evalExpr(cargs[0], vars);
      if (tg == null) { list.push({ label, unknown: body }); return; }
      const p = portablePath(tg); if (p !== tg) R.converted = true;
      list.push({ label, target: p });
    } else if (fn === 'HandleScript' || fn === 'ToggleScript') {
      const path = evalExpr(cargs[0], vars);
      if (path == null) { list.push({ label, unknown: body }); return; }
      const p = portablePath(path); if (p !== path) R.converted = true;
      list.push({ label, script: p });
    } else list.push({ label, unknown: body });
  });

  // مصفوفة Scripts (ملفات هذي الأداة القديمة)
  const si = top.find(i => /^global\s+Scripts\s*:=\s*\[/.test(code[i].trim()));
  if (si != null) {
    for (let k = si + 1; k < code.length && !/^\]/.test(code[k].trim()); k++) {
      const om = code[k].match(/\{(.*)\}/); if (!om) continue;
      const props = {};
      splitArgs(om[1]).forEach(p => { const c = p.indexOf(':'); if (c > 0) props[p.slice(0, c).trim()] = p.slice(c + 1).trim(); });
      const name = evalExpr(props.Name, vars), path = evalExpr(props.Path, vars);
      if (name != null && path != null) scriptItems.push({ name, path: portablePath(path) });
    }
  }

  const showBlock = blocks.find(b => b.kind !== 'func' && /\.Show\(|ShowMainMenu/.test(b.body) && !/InfoGui/.test(b.body));
  const smFunc = blocks.find(b => b.kind === 'func' && b.name === 'ShowMainMenu');
  let main = null;
  const showSrc = (smFunc ? smFunc.body : '') + '\n' + (showBlock ? showBlock.body : '');
  const shm = showSrc.match(/(\w+)\.Show\(/);
  if (shm && menus[shm[1]]) main = shm[1];
  if (!main) main = menuOrder.find(n => menus[n].some(x => x.sub)) || (menus.ScriptMenu ? 'ScriptMenu' : menuOrder[0]);

  const splitName = n => { const k = n.indexOf('\u200E'); return k < 0 ? { label: n.trim(), suffix: '' } : { label: n.slice(0, k).trim(), suffix: n.slice(k + 1).trim() }; };
  scriptItems.forEach(x => s.scripts.push(Object.assign(splitName(x.name), { path: x.path })));
  const used = new Set([main]);
  const others = { title: L('⭐ أخرى', '⭐ Other'), items: [] };
  const subItems = (name, depth) => {
    const items = [];
    (menus[name] || []).forEach(x => {
      if (x.sep) items.push({ label: '-', target: '' });
      else if (x.target != null) items.push({ label: x.label, target: x.target });
      else if (x.script != null) items.push({ label: x.label, target: x.script });
      else if (x.sub) { used.add(x.sub); R.skipped.push(L('قائمة داخل قائمة ("', 'Menu inside a menu ("') + x.label + L('") — دمجت عناصرها في القائمة الأعلى', '") — its items were merged into the parent menu')); items.push(...subItems(x.sub, depth + 1)); }
      else if (x.unknown) R.skipped.push('"' + x.label + '": ' + x.unknown);
    });
    return items;
  };
  if (main) (menus[main] || []).forEach(x => {
    if (x.sep) return;
    if (x.script != null) s.scripts.push(Object.assign(splitName(x.label), { path: x.script }));
    else if (x.sub) { used.add(x.sub); s.submenus.push({ title: x.label, items: subItems(x.sub, 1) }); }
    else if (x.extra) s.extras[x.extra] = true;
    else if (x.target != null) others.items.push({ label: x.label, target: x.target });
    else if (x.unknown) R.skipped.push('"' + x.label + '": ' + x.unknown);
  });
  if (others.items.length) s.submenus.push(others);
  menuOrder.filter(n => !used.has(n)).forEach(n => { if ((menus[n] || []).length) R.skipped.push(L('قائمة "', 'Menu "') + n + L('" ما كانت مربوطة بالقائمة الرئيسية', '" wasn\'t attached to the main menu')); });

  // ---------- الاختصارات ----------
  const strings = body => { const out = []; const re = /"((?:[^"`\n]|`.)*)"/g; let m; while ((m = re.exec(body))) out.push(readStr('"' + m[1] + '"', 0).val); return out; };
  blocks.filter(b => b.kind !== 'func').forEach(b => {
    const body = b.body; const key = b.key.trim();
    const kind = b.kind === 'hotstring' ? 'hotstring' : 'hotkey';
    const label = (kind === 'hotstring' ? L('النص ', 'Text ') : L('الاختصار ', 'Shortcut ')) + key;
    if (b === showBlock) { s.menuWildcard = key.startsWith('*'); s.menuKey = key.replace(/^[*~$]+/, ''); return; }
    if (kind === 'hotkey' && /Media_Next/.test(body)) { s.media.enabled = true; s.media.next = key; return; }
    if (kind === 'hotkey' && /Media_Prev/.test(body)) { s.media.enabled = true; s.media.prev = key; return; }
    if (kind === 'hotkey' && /Media_Play_Pause/.test(body)) { s.media.enabled = true; s.media.play = key; return; }
    if (kind === 'hotkey' && /OverlayVisible|InfoGui\.(Hide|Show)/.test(body)) { s.overlay.toggleKey = key; return; }
    const og = body.indexOf('OpenGroup(');
    if (og >= 0) {
      const oneLine = body.replace(/\n\s*/g, ' ');
      const o2 = oneLine.indexOf('OpenGroup(') + 'OpenGroup('.length;
      const arrOpen = oneLine.indexOf('[', o2), arrClose = matchParen(oneLine, arrOpen);
      if (arrOpen >= 0 && arrClose > 0) {
        const items = splitArgs(oneLine.slice(arrOpen + 1, arrClose)).map(x => evalExpr(x, vars)).filter(x => x != null).map(portablePath);
        s.groups.push({ kind, trigger: key, newWindow: !/\],\s*false/.test(oneLine.slice(arrClose)), targets: items.join('\n') });
        return;
      }
    }
    const urls = strings(body).filter(x => /^https?:\/\//i.test(x));
    if (urls.length >= 2 && /\bRun\(/.test(body)) { s.groups.push({ kind, trigger: key, newWindow: /--new-window/.test(body), targets: urls.join('\n') }); return; }
    if (/PasteText\(/.test(body)) {
      const oneLine = body.replace(/\n\s*/g, ' '); const p = oneLine.indexOf('PasteText(') + 9; const c = matchParen(oneLine, p);
      const args = splitArgs(oneLine.slice(p + 1, c));
      const txt = evalExpr(args[0], vars);
      if (txt != null) { s.snippets.push({ kind, trigger: key, instant: true, text: txt, pre: evalExpr(args[1] || '""', vars) || '' }); return; }
    }
    if (/A_Clipboard\s*:=/.test(body) && /\^v/.test(body)) {

  // ---------- الشريط العائم ----------
  const up = blocks.find(b => b.kind === 'func' && b.name === 'UpdateStatusOverlay');
  const topText = top.map(i => code[i]).join('\n');

    const part = ai >= 0 ? body.slice(ai) : body;
    const found = OV_KEYS.map(k => [k, part.search(OV_DETECT[k])]).filter(([, i]) => i >= 0).sort((a, b) => a[1] - b[1]).map(([k]) => k);
    if (found.length) { o.fields = allFields(false); found.forEach(k => { o.fields[k] = true; }); o.order = found.concat(OV_KEYS.filter(k => !found.includes(k))); }

    if (/h:mm:ss tt/.test(part)) o.time24 = false;
    let m;
    if ((m = topText.match(/InfoGui\.SetFont\("s(\d+)(?:\s+c(\w+))?"(?:,\s*"([^"]+)")?/))) {

    if ((m = topText.match(/WinSetTransColor\("\w+\s+(\d+)"/))) o.opacity = Number(m[1]);
    if ((m = topText.match(/SetTimer\(UpdateStatusOverlay,\s*(\d+)\)/))) o.interval = String(m[1]);
    if ((m = body.match(/StrLen\(\w+\)\s*>\s*(\d+)/))) o.clipMax = Number(m[1]);
    if ((m = topText.match(/OverlayPosX\s*:=\s*([\d.]+)/))) o.px = Number(m[1]);
    if ((m = topText.match(/OverlayPosY\s*:=\s*([\d.]+)/))) o.py = Number(m[1]);
    if (/gx\s*:=\s*wr\b/.test(topText)) o.px = 1; else if (/gx\s*:=\s*wl\b/.test(topText) || /GuiX\s*:=\s*\d+/.test(topText)) o.px = 0;
    if (/gy\s*:=\s*wt\b/.test(topText)) o.py = 0; else if (/gy\s*:=\s*wb\b/.test(topText) || /GuiY\s*:=\s*A_ScreenHeight/.test(topText)) o.py = 1;
  }
  const added = [];
  if (!s.tray) { s.tray = true; added.push(L('أيقونة في شريط المهام تفتح القائمة', 'Taskbar icon that opens the menu')); }
  if (!s.extras.startup) { s.extras.startup = true; added.push(L('زر «التشغيل مع ويندوز» في القائمة', '“Start with Windows” button in the menu')); }
  const nf = blocks.find(b => b.kind === 'func' && (b.name === 'Notify' || b.name === 'NotifyGUI'));
  s.notify = !nf || /ToolTip/.test(nf.body);

  return { state: normalize(s), report: {
    embedded: false, scripts: s.scripts.length, submenus: s.submenus.length,
    items: s.submenus.reduce((a, m) => a + m.items.filter(x => x.label !== '-').length, 0),
    groups: s.groups.length, snippets: s.snippets.length, media: s.media.enabled, overlay: s.overlay.enabled,
    moved: R.moved, skipped: R.skipped, converted: R.converted, added } };
}

async function readFileText(f) {
  const buf = await f.arrayBuffer();
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch { return new TextDecoder('windows-1256').decode(buf); }
}

function buildFromWizard() {

  ['web', 'app', 'music'].forEach(cat => {
    const items = picked.filter(c => c.cat === cat).map(c => ({ label: c.emoji + ' ' + L(c.ar, c.en), target: c.target }));
    if (items.length) s.submenus.push({ title: titles[cat], items });
  });
  s.media.enabled = !!W.media;

  $('#fileNameLabel').textContent = L('اسم الملف', 'File name');
  $('#howSum').textContent = L('كيف أشغّله بعد التنزيل؟', 'How do I run it after downloading?');
  $('#howList').replaceChildren(
    h('li', {}, L('ثبّت AutoHotkey v2 المجاني (مرة وحدة بس): ', 'Install the free AutoHotkey v2 (one time only): '), h('a', { href: 'https://www.autohotkey.com/', target: '_blank', rel: 'noopener' }, 'autohotkey.com')),
    h('li', { text: HOSTED ? L('فك ضغط الملف، ودبل كلك على ملف ‎.ahk‎', 'Unzip, then double-click the .ahk file') : L('دبل كلك على الملف اللي نزّلته', 'Double-click the file you downloaded') }),
    h('li', { text: L('اضغط زر القائمة في أي مكان. وخلاص!', 'Press your menu key anywhere. Done!') }),
    h('li', { text: L('عشان يشتغل كل ما تفتح جهازك: من القائمة اضغط «🚀 التشغيل مع ويندوز».', 'To run it every time you start your PC: click “🚀 Start with Windows” in the menu.') }));
  updateDlBtn();
}
$('#helpBtn').onclick = () => setIntro(false);
$('#langBtn').onclick = () => {
  LANG = LANG === 'en' ? 'ar' : 'en';
  try { localStorage.setItem(LANG_KEY, LANG); } catch {}
  applyStatic(); renderAll();
  applyTheme();
  if (!$('#wiz').hidden) renderWizard();
};
$('#wizBtn').onclick = () => { W = null; openWizard(0); };


/* ============================================================
   الوضع: فاتح / داكن / تلقائي
   ============================================================ */
const THEME_KEY = 'ahk-organizer-builder:theme';
let THEME = (() => { try { const v = localStorage.getItem(THEME_KEY); if (v === 'light' || v === 'dark') return v; } catch {} return 'auto'; })();
function applyTheme() {
  const de = document.documentElement;
  if (THEME === 'auto') de.removeAttribute('data-theme'); else de.setAttribute('data-theme', THEME);
  const b = $('#themeBtn'); if (!b) return;
  const lab = { auto: L('🌓 تلقائي', '🌓 Auto'), light: L('🖥️ كلاسيكي', '🖥️ Classic'), dark: L('⬛ تباين عالي', '⬛ High contrast') }[THEME];
  b.textContent = lab; b.title = L('تغيير الوضع (كلاسيكي / تباين عالي / تلقائي)', 'Change mode (classic / high contrast / auto)');
  b.setAttribute('aria-label', L('الوضع: ', 'Mode: ') + lab);
}
$('#themeBtn').onclick = () => {
  THEME = { auto: 'light', light: 'dark', dark: 'auto' }[THEME];
  try { localStorage.setItem(THEME_KEY, THEME); } catch {}
  applyTheme();
};
function renderFooter() {
  const f = $('#foot'); f.replaceChildren();
  f.append(h('span', { text: brandName() + ' ' + BRAND.version + (BRAND.owner ? ' — ' + BRAND.owner : '') }));
  if (BRAND.store) f.append(h('a', { href: BRAND.store, target: '_blank', rel: 'noopener' }, L('المتجر', 'Store')));
  if (BRAND.support) f.append(h('a', { href: BRAND.support, target: '_blank', rel: 'noopener' }, L('الدعم والمساعدة', 'Help & support')));
  f.append(h('span', { class: 'muted', text: L('يتطلب AutoHotkey v2 على ويندوز', 'Requires AutoHotkey v2 on Windows') }));
}

/* ---------- النوافذ: Escape، حبس التركيز، إغلاق منتقي الإيموجي ---------- */
document.addEventListener('keydown', e => {
  const pk = $('#picker'), wz = $('#wiz');
  const top = !pk.hidden ? pk : !wz.hidden ? wz : null;
  if (!top) return;
  if (e.key === 'Escape' && top === pk && !document.querySelector('.keycap.listening') && !pk.querySelector('.emo-pop:not([hidden])')) { e.preventDefault(); closePicker(); return; }
  if (e.key !== 'Tab') return;
  const f = [...top.querySelectorAll('button:not([disabled]), input:not([type=hidden]), select, textarea, a[href], [tabindex="0"]')].filter(x => x.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
document.addEventListener('pointerdown', e => {
  document.querySelectorAll('.emo-pop:not([hidden])').forEach(pop => {
    if (!pop.parentElement.contains(e.target)) { pop.hidden = true; pop.parentElement.querySelector('.emo-btn')?.setAttribute('aria-expanded', 'false'); }
  });
});


/* ============================================================
   ويندوز 95: شريط المهام، قائمة ابدأ، الساعة، قائمة الإنجاز
   ============================================================ */
const DL_KEY = 'ahk-organizer-builder:downloaded';
const wasDownloaded = () => { try { return localStorage.getItem(DL_KEY) === '1'; } catch { return false; } };
{
  const orig = $('#dlBtn').onclick;
  $('#dlBtn').onclick = async () => { await orig(); try { localStorage.setItem(DL_KEY, '1'); } catch {} renderChecklist(); };
}
$('#trayDl').onclick = () => $('#dlBtn').onclick();
function renderChecklist() {
  const n = S.submenus.reduce((a, m) => a + m.items.filter(i => one(i.label) && one(i.label) !== '-' && String(i.target || '').trim()).length, 0) + validScripts().length;
  const warns = validate().length;
  const items = [
    [n >= 3, L('أضف 3 مواقع أو برامج على الأقل', 'Add at least 3 sites or apps') + ' (' + Math.min(n, 3) + '/3)', () => { current = 'menu'; renderTabs(); renderPanel(); $('#panel').scrollIntoView({ behavior: 'smooth' }); }],
    [warns === 0, warns ? L('صلّح التنبيهات', 'Fix the warnings') + ' (' + warns + ')' : L('ما فيه أي تنبيه', 'No warnings'), () => { warnsOpen = true; renderSide(); $('#sideCard').scrollIntoView({ behavior: 'smooth' }); }],
    [wasDownloaded(), L('نزّل منظّمك وشغّله', 'Download and run your organizer'), () => $('#dlBtn').focus()],
  ];
  $('#ckTitle').textContent = L('خطواتك:', 'Your steps:');
  $('#checklist').replaceChildren(...items.map(([ok, t, go]) => h('li', { class: ok ? 'ok' : '' },
    h('span', { class: 'bx', 'aria-hidden': 'true', text: ok ? '✓' : '' }), h('span', { text: t }),
    ok ? h('span', { class: 'sr', text: L(' (تم)', ' (done)') }) : h('button', { type: 'button', class: 'btn small go', onclick: go }, L('يلا', 'Go')))));
}
function startItems() {
  const tab = id => () => { current = id; openRow = null; renderTabs(); renderPanel(); $('#tabs').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  return [
    ['🧭', L('المعالج', 'Wizard'), () => { W = null; openWizard(1); }],
    ['📂', L('فتح ملف ‎.ahk‎…', 'Open .ahk file…'), () => $('#importFile').click()],
    ['⬇️', L('نزّل منظّمي', 'Download my organizer'), () => $('#dlBtn').onclick()],
    null,
    ['📋', L('قائمتي', 'My menu'), tab('menu')],
    ['⌨️', L('أزراري', 'My keys'), tab('keys')],
    ['📊', L('الشريط', 'Info panel'), tab('overlay')],
    ['⚙️', L('إعدادات', 'Settings'), tab('settings')],
    ['🧑‍💻', L('للمحترفين', 'Pro'), tab('pro')],
    null,
    ['❓', L('وش هو المنظّم؟', 'What is this?'), () => setIntro(false)],
    ['🌓', L('تغيير الوضع', 'Change mode'), () => $('#themeBtn').click()],
    ['🌐', L('English', 'العربية'), () => $('#langBtn').click()],
  ];
}
function openStart() {
  const m = $('#startMenu'); m.replaceChildren(
    h('div', { class: 'banner', 'aria-hidden': 'true' }, h('span', {}, h('b', { text: L('المنظّم', 'Organizer') }), ' 95')),
    h('ul', {}, startItems().map(it => it ? h('li', { role: 'none' }, h('button', { type: 'button', role: 'menuitem', onclick: () => { closeStart(); it[2](); } }, h('span', { class: 'ico', text: it[0] }), it[1])) : h('li', { role: 'separator' }, h('hr')))));
  m.hidden = false; $('#startBtn').setAttribute('aria-expanded', 'true');
  m.querySelector('button').focus();
}
function closeStart(focusBack) { $('#startMenu').hidden = true; $('#startBtn').setAttribute('aria-expanded', 'false'); if (focusBack) $('#startBtn').focus(); }
$('#startBtn').onclick = () => $('#startMenu').hidden ? openStart() : closeStart();
$('#startMenu').addEventListener('keydown', e => {
  const bs = [...$('#startMenu').querySelectorAll('button')]; const i = bs.indexOf(document.activeElement);
  if (e.key === 'ArrowDown') { e.preventDefault(); bs[(i + 1) % bs.length].focus(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); bs[(i - 1 + bs.length) % bs.length].focus(); }
  else if (e.key === 'Escape') { e.preventDefault(); closeStart(true); }
  else if (e.key === 'Tab') closeStart();
});
document.addEventListener('pointerdown', e => { if (!$('#startMenu').hidden && !$('#startMenu').contains(e.target) && !$('#startBtn').contains(e.target)) closeStart(); });
function tickClock() { const d = new Date(); $('#clock').textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
tickClock(); setInterval(tickClock, 15000);
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z' && undoSnap && !$('#undo').hidden) {
    const t = e.target; if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
    e.preventDefault(); $('#undo button').click();
  }
});
function applyWin95Text() {
  $('#winTitle').textContent = brandName() + ' — ' + (one(S.title) || L('منظّمي', 'My Organizer'));
  $('#taskBtn').textContent = '⌨️ ' + brandName();
  $('#startLabel').textContent = L('ابدأ', 'Start');
  $('#trayDl').textContent = L('⬇️ تنزيل', '⬇️ Download');
  $('#sideCard').setAttribute('data-title', L('معاينة — قائمتك', 'Preview — your menu'));
}

function renderAll() { renderTabs(); renderIntro(); renderPanel(); renderFooter(); applyWin95Text(); refresh(); }
applyTheme();
applyStatic();
renderAll();
try { if (!localStorage.getItem(SEEN_KEY)) openWizard(0); } catch { openWizard(0); }
</script>
</body>
</html>
