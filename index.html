<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صانع المنظّم — مولّد سكربتات AutoHotkey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8ECF1; --panel:#FFFFFF; --panel-2:#F4F6F9; --ink:#17202D; --muted:#5A6677; --line:#D2D9E2;
  --accent:#2C57E0; --accent-ink:#FFFFFF; --accent-soft:#E3E9FC; --danger:#C2372F; --warn-bg:#FFF4DC; --warn-ink:#7A4E00;
  --key-top:#FDFDFE; --key-side:#B9C2CE; --key-ink:#1D2633;
  --code-bg:#111A29; --code-ink:#D5DDEA; --code-muted:#6D7C93;
  --radius:10px;
  --ui:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  --mono:"JetBrains Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E131B; --panel:#161D28; --panel-2:#1B2330; --ink:#E4E9F0; --muted:#8F9CAE; --line:#2A3443;
    --accent:#7896FF; --accent-ink:#0B1020; --accent-soft:#1F2A47; --danger:#F07269; --warn-bg:#33290F; --warn-ink:#F3CD7A;
    --key-top:#253247; --key-side:#070B12; --key-ink:#E8EDF5;
    --code-bg:#0A0F18;
  }
}
:root[data-theme="dark"]{
  --bg:#0E131B; --panel:#161D28; --panel-2:#1B2330; --ink:#E4E9F0; --muted:#8F9CAE; --line:#2A3443;
  --accent:#7896FF; --accent-ink:#0B1020; --accent-soft:#1F2A47; --danger:#F07269; --warn-bg:#33290F; --warn-ink:#F3CD7A;
  --key-top:#253247; --key-side:#070B12; --key-ink:#E8EDF5;
  --code-bg:#0A0F18;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 var(--ui); -webkit-font-smoothing:antialiased; }
button,input,select,textarea{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

/* ---------- Header ---------- */
.top{ max-width:1500px; margin:0 auto; padding:26px 20px 18px; display:flex; flex-wrap:wrap; gap:18px 28px; align-items:flex-end; justify-content:space-between; }
.brand h1{ margin:0; font-size:28px; line-height:1.25; font-weight:700; letter-spacing:-.2px; }
.brand p{ margin:6px 0 0; color:var(--muted); max-width:58ch; }
.hero-key{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; color:var(--muted); font-size:15px; }
.hero-key .caps{ gap:8px; }
.hero-key .cap{ font-size:20px; min-width:54px; padding:12px 16px 14px; border-radius:11px; box-shadow:0 5px 0 var(--key-side), 0 7px 14px rgba(10,20,40,.18); }
.toolbar{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }

.btn{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--panel); padding:7px 13px; border-radius:8px; cursor:pointer; font-size:14px; font-weight:500; white-space:nowrap; }
.btn:hover{ border-color:var(--accent); }
.btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.btn.primary:hover{ filter:brightness(1.08); }
.btn.ghost{ background:transparent; }
.btn.danger{ color:var(--danger); }
select.btn{ padding-inline-end:28px; }

/* ---------- Layout ---------- */
.app{ max-width:1500px; margin:0 auto; padding:0 20px 40px; display:grid; grid-template-columns:190px minmax(0,1.1fr) minmax(0,1fr); gap:20px; align-items:start; }
.nav{ position:sticky; top:calc(env(safe-area-inset-top,0px) + 14px); display:flex; flex-direction:column; gap:2px; }
.nav button{ display:flex; justify-content:space-between; align-items:center; gap:8px; text-align:start; background:transparent; border:0; border-radius:8px; padding:9px 12px; cursor:pointer; color:var(--muted); font-weight:500; }
.nav button:hover{ color:var(--ink); background:var(--panel-2); }
.nav button[aria-current="true"]{ background:var(--panel); color:var(--ink); box-shadow:inset -3px 0 0 var(--accent); }
.nav .count{ font-size:12px; min-width:22px; text-align:center; padding:0 6px; border-radius:20px; background:var(--panel-2); color:var(--muted); }
.nav button[aria-current="true"] .count{ background:var(--accent-soft); color:var(--accent); }

.editor{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:22px 24px 28px; min-height:60vh; }
.editor h2{ margin:0 0 4px; font-size:21px; }
.editor h3{ margin:26px 0 4px; font-size:16px; }
.editor .lead{ margin:0 0 18px; color:var(--muted); max-width:64ch; }
.editor .sublead{ margin:0 0 12px; color:var(--muted); font-size:14px; }

.fields{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px 16px; }
.field{ display:flex; flex-direction:column; gap:5px; min-width:0; }
.field.wide{ grid-column:1 / -1; }
.lab{ font-size:13px; font-weight:600; color:var(--muted); }
.hint{ font-size:12.5px; color:var(--muted); }
.inp{ width:100%; border:1px solid var(--line); background:var(--panel-2); border-radius:8px; padding:8px 10px; min-width:0; }
.inp:focus{ border-color:var(--accent); background:var(--panel); outline:none; box-shadow:0 0 0 3px var(--accent-soft); }
textarea.inp{ resize:vertical; min-height:70px; line-height:1.55; }
.ltr{ direction:ltr; text-align:left; }
.mono{ font-family:var(--mono); font-size:13px; }
.check{ display:flex; gap:9px; align-items:flex-start; cursor:pointer; padding:4px 0; }
.check input{ margin-top:5px; accent-color:var(--accent); width:16px; height:16px; flex:none; }
.check small{ display:block; color:var(--muted); font-size:12.5px; }

/* keycaps */
.hk{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.hk .inp{ width:120px; flex:none; }
.keycap{ background:none; border:1px dashed transparent; border-radius:10px; padding:4px 6px 8px; cursor:pointer; min-height:44px; }
.keycap:hover{ border-color:var(--line); }
.keycap.listening{ border-color:var(--accent); background:var(--accent-soft); }
.caps{ display:inline-flex; gap:5px; align-items:center; direction:ltr; }
.cap{ display:inline-block; min-width:32px; text-align:center; padding:5px 9px 6px; border-radius:7px; background:var(--key-top); color:var(--key-ink); border:1px solid var(--line); box-shadow:0 3px 0 var(--key-side); font:600 12.5px/1.2 var(--mono); }
.plus{ color:var(--muted); font-size:12px; }
.cap-empty{ color:var(--muted); font-size:13px; }
.cap-listen{ color:var(--accent); font-weight:600; font-size:13px; padding:6px 4px; display:inline-block; }

/* list rows */
.list{ display:flex; flex-direction:column; gap:10px; }
.row{ display:flex; gap:10px; align-items:flex-start; padding:12px; border:1px solid var(--line); border-radius:var(--radius); background:var(--panel); }
.row-fields{ flex:1; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px 12px; min-width:0; }
.row-ctl{ display:flex; flex-direction:column; gap:4px; }
.ib{ width:30px; height:30px; display:grid; place-items:center; border:1px solid var(--line); background:var(--panel-2); border-radius:7px; cursor:pointer; font-size:13px; color:var(--muted); }
.ib:hover:not(:disabled){ color:var(--ink); border-color:var(--accent); }
.ib.danger:hover:not(:disabled){ color:var(--danger); border-color:var(--danger); }
.ib:disabled{ opacity:.35; cursor:default; }
.add{ align-self:flex-start; border:1px dashed var(--line); background:transparent; border-radius:8px; padding:8px 14px; cursor:pointer; color:var(--accent); font-weight:600; }
.add:hover{ border-color:var(--accent); background:var(--accent-soft); }
.empty{ margin:0; color:var(--muted); font-size:14px; }

.group{ border:1px solid var(--line); border-radius:var(--radius); background:var(--panel-2); padding:14px; margin-bottom:14px; }
.group-head{ display:flex; gap:10px; align-items:flex-end; margin-bottom:12px; }
.group-head .field{ flex:1; }
.group-head .ctl{ display:flex; gap:4px; }

.tip{ margin-top:18px; padding:12px 14px; border-radius:8px; background:var(--panel-2); color:var(--muted); font-size:13.5px; border:1px solid var(--line); }
.tip code{ font-family:var(--mono); font-size:12.5px; background:var(--panel); padding:1px 5px; border-radius:4px; direction:ltr; display:inline-block; color:var(--ink); }
.fieldgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:2px 14px; }
.range-row{ display:flex; gap:10px; align-items:center; }
.range-row input[type=range]{ flex:1; accent-color:var(--accent); }
.range-row output{ font-family:var(--mono); font-size:13px; min-width:34px; }

/* ---------- Output panel ---------- */
.out{ position:sticky; top:calc(env(safe-area-inset-top,0px) + 14px); display:flex; flex-direction:column; height:calc(100dvh - 40px); min-height:480px; background:var(--code-bg); color:var(--code-ink); border-radius:var(--radius); overflow:hidden; }
.out-head{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 12px; border-bottom:1px solid rgba(255,255,255,.08); }
.tabs{ display:flex; gap:2px; background:rgba(255,255,255,.06); border-radius:8px; padding:3px; }
.tabs button{ border:0; background:transparent; color:var(--code-muted); padding:5px 12px; border-radius:6px; cursor:pointer; font-size:13.5px; font-weight:500; }
.tabs button[aria-selected="true"]{ background:rgba(255,255,255,.12); color:#fff; }
.out-actions{ margin-inline-start:auto; display:flex; gap:6px; flex-wrap:wrap; }
.out .btn{ background:rgba(255,255,255,.06); border-color:rgba(255,255,255,.12); color:var(--code-ink); }
.out .btn:hover{ border-color:#7896FF; }
.out .btn.primary{ background:#4B6FF0; border-color:#4B6FF0; color:#fff; }
.fname{ display:flex; align-items:center; gap:6px; padding:8px 12px; font-size:13px; color:var(--code-muted); border-bottom:1px solid rgba(255,255,255,.08); }
.fname input{ background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); color:#fff; border-radius:6px; padding:4px 8px; width:180px; direction:ltr; font-family:var(--mono); font-size:12.5px; }
.fname .stats{ margin-inline-start:auto; font-family:var(--mono); font-size:12px; }
.warns{ margin:0; padding:10px 14px 10px 14px; background:#3A2D0E; color:#F5D48B; font-size:13px; list-style:none; display:flex; flex-direction:column; gap:3px; max-height:130px; overflow:auto; }
.warns:empty{ display:none; }
.warns li::before{ content:"⚠ "; }
.code{ flex:1; overflow:auto; margin:0; padding:14px 16px 30px; direction:ltr; text-align:left; font:12.5px/1.65 var(--mono); tab-size:4; white-space:pre; }
.t-c{ color:#6F819C; font-style:italic; } .t-s{ color:#A8D89A; } .t-d{ color:#F28FAD; } .t-h{ color:#FFC56B; font-weight:600; } .t-k{ color:#C59CFF; } .t-f{ color:#79C0FF; }

.preview{ flex:1; overflow:auto; padding:24px 18px; background:
  radial-gradient(circle at 20% 10%, rgba(120,150,255,.18), transparent 40%),
  radial-gradient(circle at 80% 90%, rgba(60,200,180,.12), transparent 45%), #1A2436; }
.preview p{ margin:0 0 14px; color:#B7C3D6; font-size:13.5px; }
.ctx{ width:min(300px,100%); background:#F7F8FA; color:#1B1F26; border:1px solid #C9CED6; border-radius:8px; padding:4px; box-shadow:0 10px 30px rgba(0,0,0,.35); font-size:13.5px; }
.mi{ display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:5px; cursor:default; user-select:none; }
.mi:hover{ background:#DCE5FA; }
.mi .chk{ width:14px; flex:none; color:#2C57E0; font-weight:700; }
.mi .mt{ flex:1; } .mi .sfx{ color:#7A8394; direction:ltr; unicode-bidi:isolate; }
.mi .arr{ color:#7A8394; }
.sep{ height:1px; background:#D8DCE3; margin:4px 6px; }
.subbox{ margin:2px 22px 4px 4px; border-inline-start:2px solid #C9D3EA; padding-inline-start:4px; }

@media (max-width:1150px){
  .app{ grid-template-columns:1fr; }
  .nav{ position:static; flex-direction:row; overflow-x:auto; gap:4px; padding-bottom:2px; }
  .nav button{ flex:none; }
  .nav button[aria-current="true"]{ box-shadow:inset 0 -3px 0 var(--accent); }
  .out{ position:static; height:75vh; }
}
@media (max-width:640px){
  .top{ padding-top:18px; }
  .brand h1{ font-size:23px; }
  .editor{ padding:18px 14px 22px; }
  .fields,.row-fields{ grid-template-columns:1fr; }
  .row{ flex-direction:column; }
  .row-ctl{ flex-direction:row; align-self:flex-end; }
  .hero-key .cap{ font-size:16px; min-width:44px; padding:9px 12px 11px; }
}
@media (prefers-reduced-motion: no-preference){
  .keycap.listening .cap-listen{ animation:blink 1.1s ease-in-out infinite; }
  @keyframes blink{ 50%{ opacity:.45; } }
}
.ovprev-wrap{ padding:22px; border-radius:var(--radius); background:linear-gradient(135deg,#27496d 0%,#3d3a6b 55%,#1f5c63 100%); overflow-x:auto; }
.ovprev{ margin:0; display:inline-block; background:rgba(0,0,0,.35); padding:8px 10px; border-radius:4px; line-height:1.3; white-space:pre; text-align:left; }
.screen{ position:relative; width:100%; max-width:540px; aspect-ratio:16/9; border:7px solid #1C2230; border-radius:9px; overflow:hidden; direction:ltr; touch-action:none;
  background:linear-gradient(135deg,#27496d 0%,#3d3a6b 55%,#1f5c63 100%); }
.screen .task{ position:absolute; left:0; right:0; bottom:0; height:4.4%; background:rgba(14,18,26,.9); }
.ov-block{ position:absolute; border:1.5px solid rgba(255,255,255,.9); border-radius:3px; cursor:grab; touch-action:none;
  background:repeating-linear-gradient(to bottom, rgba(255,255,255,.55) 0 1px, transparent 1px 5px), rgba(0,0,0,.45); background-clip:padding-box; }
.ov-block:active{ cursor:grabbing; }
.ov-block:focus-visible{ outline:2px solid #FFC56B; outline-offset:2px; }
.corners{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.corners .btn{ font-size:13px; padding:5px 10px; }
.ovorder{ display:flex; flex-direction:column; gap:4px; max-width:520px; }
.ovrow{ display:flex; align-items:center; gap:8px; padding:5px 8px; border:1px solid var(--line); border-radius:8px; background:var(--panel); }
.ovrow.off{ opacity:.55; }
.ovrow input{ accent-color:var(--accent); width:16px; height:16px; }
.ovname{ flex:1; cursor:pointer; display:flex; justify-content:space-between; gap:10px; }
.ovname .ven{ font-family:var(--mono); font-size:12.5px; color:var(--muted); direction:ltr; }
.ovrow .ib{ width:26px; height:26px; }
.report{ position:relative; border:1px solid var(--line); border-inline-start:4px solid var(--accent); background:var(--accent-soft); border-radius:8px; padding:12px 14px 12px 44px; margin-bottom:18px; font-size:14px; }
.report.ok{ border-inline-start-color:#2E9E6A; }
.report p{ margin:6px 0 0; }
.report .ib{ position:absolute; top:8px; left:8px; }
.report details{ margin-top:6px; } .report summary{ cursor:pointer; color:var(--muted); }
.report ul{ margin:6px 0 0; padding-inline-start:20px; font-size:13px; direction:rtl; }
.toast{ position:fixed; bottom:calc(env(safe-area-inset-bottom,0px) + 20px); left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:8px; font-size:14px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:10; }
.toast.show{ opacity:1; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <h1 id="brandName">صانع المنظّم</h1>
    <p>صمّم منظّم AutoHotkey الخاص فيك: قائمة سريعة، مواقع وبرامج، اختصارات، وشريط معلومات. كل تعديل يظهر فوراً في الكود، وبعدها نزّل ملف ‎.ahk‎ جاهز للتشغيل.</p>
  </div>
  <div class="hero-key" aria-live="polite"><span>قائمتك تظهر بضغطة</span><span id="heroCaps"></span></div>
  <div class="toolbar">
    <label class="sr" for="preset">ابدأ من قالب</label>
    <select id="preset" class="btn">
      <option value="">ابدأ من قالب…</option>
      <option value="example">قالب كامل (مثال)</option>
      <option value="empty">منظّم فارغ</option>
    </select>
    <button class="btn" id="importBtn" type="button">فتح ملف ‎.ahk‎ أو إعدادات</button>
    <input type="file" id="importFile" accept=".ahk,.json,.txt" hidden>
    <button class="btn" id="exportBtn" type="button">حفظ الإعدادات</button>
  </div>
</header>

<main class="app">
  <nav class="nav" id="nav" aria-label="أقسام الإعدادات"></nav>
  <section class="editor" id="editor" aria-live="off"></section>
  <section class="out" aria-label="الناتج">
    <div class="out-head">
      <div class="tabs" role="tablist">
        <button role="tab" id="tabCode" aria-selected="true" type="button">الكود</button>
        <button role="tab" id="tabPrev" aria-selected="false" type="button">معاينة القائمة</button>
      </div>
      <div class="out-actions">
        <button class="btn" id="copyBtn" type="button">نسخ الكود</button>
        <button class="btn primary" id="dlBtn" type="button">تنزيل الملف</button>
      </div>
    </div>
    <div class="fname"><label for="fileName">اسم الملف</label><input id="fileName" value="MyOrganizer"><span>.ahk</span><span class="stats" id="stats"></span></div>
    <ul class="warns" id="warns"></ul>
    <pre class="code" id="code" tabindex="0" aria-label="كود AutoHotkey الناتج"></pre>
    <div class="preview" id="preview" hidden></div>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
/* ============================================================
   إعدادات المنتج (عدّلها قبل البيع)
   ============================================================ */
const BRAND = { name: 'صانع المنظّم', version: '1.0' };

/* ============================================================
   أدوات عامة
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
let uid = 0;
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (['value', 'checked', 'disabled', 'hidden', 'type'].includes(k)) el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return el;
}
const clone = o => JSON.parse(JSON.stringify(o));
const one = s => String(s ?? '').replace(/[\r\n]+/g, ' ').trim();
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ============================================================
   القوالب
   ============================================================ */
/* الشريط العائم: كل معلومة بالإنجليزي، مع ترتيب يختاره المستخدم */
const OV = {
  date:       { ar: 'التاريخ',        en: 'Date',       icon: '📅', sample: 'Wed, 23 Sep 2026' },
  time:       { ar: 'الوقت',          en: 'Time',       icon: '🕒', sample: '14:05:33' },
  hijri:      { ar: 'التاريخ الهجري', en: 'Hijri',      icon: '🌙', sample: '11 Rabi II 1448' },
  uptime:     { ar: 'مدة التشغيل',    en: 'Uptime',     icon: '⏳', sample: '01:22:10' },
  battery:    { ar: 'البطارية',       en: 'Battery',    icon: '🔋', sample: '85% (plugged in)' },
  volume:     { ar: 'الصوت',          en: 'Volume',     icon: '🔊', sample: '40%' },
  mic:        { ar: 'المايك',         en: 'Mic',        icon: '🎤', sample: 'On' },
  lang:       { ar: 'لغة الكيبورد',   en: 'Keyboard',   icon: '🌐', sample: 'EN' },
  caps:       { ar: 'Caps Lock',      en: 'Caps Lock',  icon: '🔠', sample: 'OFF' },
  num:        { ar: 'Num Lock',       en: 'Num Lock',   icon: '🔢', sample: 'ON' },
  brightness: { ar: 'الإضاءة',        en: 'Brightness', icon: '☀️', sample: '70%' },
  disk:       { ar: 'مساحة القرص C',  en: 'Disk C',    icon: '💾', sample: '120.5 GB free' },
  clipboard:  { ar: 'آخر نص منسوخ',   en: 'Clipboard',  icon: '📋', sample: 'https://example.com/page' },
};
const OV_KEYS = Object.keys(OV);

  const src = (o && o.overlay) || {};
  const ov = Object.assign(clone(BASE.overlay), src);
  // ترقية ملفات الإعدادات القديمة
  if (src.corner && src.px == null) { ov.px = src.corner.endsWith('r') ? 1 : 0; ov.py = src.corner.startsWith('b') ? 1 : 0; }

  ov.fields = src.fields ? Object.assign(allFields(false), f) : clone(BASE.overlay.fields);
  const order = Array.isArray(src.order) ? src.order.filter(k => OV_KEYS.includes(k)) : [];
  ov.order = order.concat(OV_KEYS.filter(k => !order.includes(k)));
  ov.px = Math.min(1, Math.max(0, Number(ov.px) || 0));
  ov.py = Math.min(1, Math.max(0, Number(ov.py) || 0));
  s.overlay = ov;
  for (const k of ['scripts', 'submenus', 'groups', 'snippets']) if (!Array.isArray(s[k])) s[k] = [];

const CODE_MAP = {
  ArrowLeft: 'Left', ArrowRight: 'Right', ArrowUp: 'Up', ArrowDown: 'Down', Space: 'Space', Enter: 'Enter', Tab: 'Tab',
  Escape: 'Esc', Backspace: 'Backspace', Delete: 'Delete', Insert: 'Insert', Home: 'Home', End: 'End', PageUp: 'PgUp', PageDown: 'PgDn',
  Minus: '-', Equal: '=', BracketLeft: '[', BracketRight: ']', Backslash: '\\', Semicolon: '`;', Quote: "'", Comma: ',', Period: '.', Slash: '/',
  Backquote: 'SC029', NumpadAdd: 'NumpadAdd', NumpadSubtract: 'NumpadSub', NumpadMultiply: 'NumpadMult', NumpadDivide: 'NumpadDiv',
  NumpadEnter: 'NumpadEnter', NumpadDecimal: 'NumpadDot', Pause: 'Pause', PrintScreen: 'PrintScreen', ScrollLock: 'ScrollLock',
  CapsLock: 'CapsLock', ContextMenu: 'AppsKey', MediaPlayPause: 'Media_Play_Pause', MediaTrackNext: 'Media_Next', MediaTrackPrevious: 'Media_Prev',
};
function codeToAhk(code) {
  if (/^Key[A-Z]$/.test(code)) return code.slice(3).toLowerCase();
  if (/^Digit\d$/.test(code)) return code.slice(5);
  if (/^F\d{1,2}$/.test(code)) return code;
  if (/^Numpad\d$/.test(code)) return code;
  return CODE_MAP[code] || null;
}
const KEY_PRETTY = { Left: '←', Right: '→', Up: '↑', Down: '↓', '`;': ';', SC029: '`', PgUp: 'Page Up', PgDn: 'Page Down', Esc: 'Esc' };
function parseHotkey(hk) {
  const m = String(hk || '').trim().match(/^([*~$]*)([\^!+#<>]*)(.*)$/);
  if (!m) return null;
  const mods = m[2].replace(/[<>]/g, '');
  return { prefix: m[1], mods, key: m[3] };
}
function renderCaps(hk) {
  const p = parseHotkey(hk);
  if (!p || !p.key) return [h('span', { class: 'cap-empty', text: 'اضغط لتسجيل اختصار' })];
  const names = [];
  if (p.mods.includes('^')) names.push('Ctrl');
  if (p.mods.includes('!')) names.push('Alt');
  if (p.mods.includes('+')) names.push('Shift');
  if (p.mods.includes('#')) names.push('Win');
  let k = KEY_PRETTY[p.key] || (p.key.length === 1 ? p.key.toUpperCase() : p.key);
  names.push(k);
  const wrap = h('span', { class: 'caps' });
  names.forEach((n, i) => { if (i) wrap.append(h('span', { class: 'plus', text: '+' })); wrap.append(h('span', { class: 'cap', text: n })); });
  return [wrap];
}
function prettyHotkey(hk) {
  const p = parseHotkey(hk); if (!p || !p.key) return '';
  const n = [];
  if (p.mods.includes('^')) n.push('Ctrl'); if (p.mods.includes('!')) n.push('Alt');
  if (p.mods.includes('+')) n.push('Shift'); if (p.mods.includes('#')) n.push('Win');
  n.push(KEY_PRETTY[p.key] || (p.key.length === 1 ? p.key.toUpperCase() : p.key));
  return n.join(' + ');
}

    oninput: e => { obj[key] = o.type === 'number' ? Number(e.target.value) : e.target.value; changed(); o.onInput && o.onInput(); } });

function hotkeyField(label, obj, key, o = {}) {
  let listening = false, lastSet = 0;
  const raw = h('input', { class: 'inp ltr mono', dir: 'ltr', 'aria-label': label + ' بصيغة AutoHotkey', title: 'صيغة AutoHotkey — يمكنك تعديلها يدوياً',
    oninput: e => { obj[key] = e.target.value.trim(); paint(); changed(); } });
  raw.value = obj[key] || '';

    onclick: () => { if (Date.now() - lastSet < 400) return; listening = true; paint(); } });
  function paint() {
    cap.classList.toggle('listening', listening);
    cap.replaceChildren(...(listening ? [h('span', { class: 'cap-listen', text: 'اضغط الاختصار الآن… (Esc للإلغاء)' })] : renderCaps(obj[key])));

function ovLabels() {

}
function ovSample(k) { return k === 'time' && String(S.overlay.time24) === 'false' ? '2:05:33 PM' : OV[k].sample; }
function renderOvPreview() {
  const el = document.getElementById('ovPrev'); if (!el) return;
  const o = S.overlay; const lines = ovLabels();
  el.textContent = lines.length ? lines.map(([k, lab]) => lab + ovSample(k)).join('\n') : '(ما اخترت أي معلومة)';
  const hex = (o.color || '#ffffff');

  el.style.fontSize = (clampN(o.fontSize, 7, 20, 10) * 1.333) + 'px';

function ovGeom(screen) {
  const W = screen.clientWidth, H = screen.clientHeight, s = W / 1920;
  const workH = H - H * 0.044;
  const o = S.overlay; const n = Math.max(1, ovLabels().length);
  const bw = (clampN(o.width, 200, 900, 400) + 20) * s;
  const bh = (n * clampN(o.fontSize, 7, 20, 10) * 1.333 * 1.3 + 16) * s;
  const m = 15 * s;
  return { bw, bh, m, freeW: W - bw - 2 * m, freeH: workH - bh - 2 * m };
}
function placeBlock(screen, block) {
  const g = ovGeom(screen); const o = S.overlay;
  block.style.width = g.bw + 'px'; block.style.height = g.bh + 'px';
  block.style.left = (g.m + Math.max(0, g.freeW) * o.px) + 'px';
  block.style.top = (g.m + Math.max(0, g.freeH) * o.py) + 'px';
  block.setAttribute('aria-valuetext', Math.round(o.px * 100) + '% من اليسار، ' + Math.round(o.py * 100) + '% من الأعلى');
}

/* ============================================================
   مولّد الكود
   ============================================================ */
function q(s) {
  return '"' + String(s ?? '').replace(/`/g, '``').replace(/"/g, '`"').replace(/\r?\n/g, '`n').replace(/\t/g, '`t') + '"';
}
const A_VARS = ['A_Desktop', 'A_DesktopCommon', 'A_MyDocuments', 'A_AppData', 'A_AppDataCommon', 'A_ProgramFiles', 'A_StartMenu', 'A_Startup', 'A_ScriptDir', 'A_UserName', 'A_WinDir', 'A_Temp', 'A_ComputerName', 'A_ProgramsCommon', 'A_Programs'];
const ENV_VARS = ['USERPROFILE', 'LOCALAPPDATA', 'APPDATA', 'ONEDRIVE', 'PROGRAMFILES', 'WINDIR', 'TEMP'];
function normTarget(p) { p = String(p ?? '').trim(); if (/^www\./i.test(p)) p = 'https://' + p; return p; }
function pexpr(p) {
  p = normTarget(p);
  const ex = []; let lit = ''; let last = 0;
  const re = /%([A-Za-z_]+)%/g; let m;
  while ((m = re.exec(p))) {
    const name = m[1];
    const isA = A_VARS.find(v => v.toLowerCase() === name.toLowerCase());
    const isE = ENV_VARS.includes(name.toUpperCase());
    if (!isA && !isE) continue;
    lit += p.slice(last, m.index);
    if (lit) ex.push(q(lit)); lit = '';
    ex.push(isA ? isA : 'EnvGet(' + q(name.toUpperCase()) + ')');
    last = m.index + m[0].length;
  }
  lit += p.slice(last);
  if (lit) ex.push(q(lit));
  return ex.length ? ex.join(' ') : '""';
}
function hsTrigger(t) { return String(t || '').trim().replace(/`/g, '``'); }
function box(text) {
  const lines = String(text || '').split('\n');
  return '┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓\n' + lines.map(l => '   ' + l).join('\n') + '\n┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛';
}

const validSubmenus = () => S.submenus.filter(m => one(m.title) && validItems(m).some(it => one(it.label) !== '-'));

    if (kind === 'hotkey' && /OverlayVisible|InfoGui\.(Hide|Show)/.test(body)) { s.overlay.toggleKey = key; return; }
    const og = body.indexOf('OpenGroup(');
    if (og >= 0) {
      const oneLine = body.replace(/\n\s*/g, ' ');
      const o2 = oneLine.indexOf('OpenGroup(') + 'OpenGroup('.length;
      const arrOpen = oneLine.indexOf('[', o2), arrClose = matchParen(oneLine, arrOpen);
      if (arrOpen >= 0 && arrClose > 0) {
        const items = splitArgs(oneLine.slice(arrOpen + 1, arrClose)).map(x => evalExpr(x, vars)).filter(x => x != null).map(portablePath);
        s.groups.push({ kind, trigger: key, newWindow: !/\],\s*false/.test(oneLine.slice(arrClose)), targets: items.join('\n') });
        return;
      }
    }
    const urls = strings(body).filter(x => /^https?:\/\//i.test(x));
    if (urls.length >= 2 && /\bRun\(/.test(body)) { s.groups.push({ kind, trigger: key, newWindow: /--new-window/.test(body), targets: urls.join('\n') }); return; }
    if (/PasteText\(/.test(body)) {
      const oneLine = body.replace(/\n\s*/g, ' '); const p = oneLine.indexOf('PasteText(') + 9; const c = matchParen(oneLine, p);
      const args = splitArgs(oneLine.slice(p + 1, c));
      const txt = evalExpr(args[0], vars);
      if (txt != null) { s.snippets.push({ kind, trigger: key, instant: true, text: txt, pre: evalExpr(args[1] || '""', vars) || '' }); return; }
    }
    if (/A_Clipboard\s*:=/.test(body) && /\^v/.test(body)) {
      const local = Object.assign({}, vars);
      body.split('\n').forEach(l => { const m = l.trim().match(/^([A-Za-z_]\w*)\s*:=\s*(.+)$/); if (m) { const v = evalExpr(m[2], local); if (v != null) local[m[1]] = v; } });
      const am = body.match(/A_Clipboard\s*:=\s*([^\n]+)/g) || [];
      let txt = null;
      for (const a of am) { const v = evalExpr(a.replace(/^A_Clipboard\s*:=\s*/, ''), local); if (v) { txt = v; break; } }
      const pre = [...body.matchAll(/Send\(\s*"((?:[^"`]|`.)*)"\s*\)/g)].map(m => m[1]).filter(x => x !== '^v')[0] || '';
      if (txt) { s.snippets.push({ kind, trigger: key, instant: true, text: txt, pre }); return; }
    }
    move(b, label);
  });

  // ---------- الوظائف ----------
  blocks.filter(b => b.kind === 'func' && !KNOWN_FUNCS.has(b.name)).forEach(b => move(b, 'الوظيفة ' + b.name + '()'));

  // ---------- الشريط العائم ----------
  const up = blocks.find(b => b.kind === 'func' && b.name === 'UpdateStatusOverlay');
  const topText = top.map(i => code[i]).join('\n');
  if (up || /InfoGui\s*:=\s*Gui\(/.test(topText)) {
    const o = s.overlay; o.enabled = true;
    const body = up ? up.body : '';
    const ai = body.indexOf('DisplayText :=') >= 0 ? body.indexOf('DisplayText :=') : body.indexOf('InfoText.Value');
    const part = ai >= 0 ? body.slice(ai) : body;
    const found = OV_KEYS.map(k => [k, part.search(OV_DETECT[k])]).filter(([, i]) => i >= 0).sort((a, b) => a[1] - b[1]).map(([k]) => k);
    if (found.length) { o.fields = allFields(false); found.forEach(k => { o.fields[k] = true; }); o.order = found.concat(OV_KEYS.filter(k => !found.includes(k))); }
    o.icons = /"[^"\w\s]{1,3}\s/.test(part) && /📅|🔋|⏳|📋/.test(part);
    if (/h:mm:ss tt/.test(part)) o.time24 = false;
    let m;
    if ((m = topText.match(/InfoGui\.SetFont\("s(\d+)(?:\s+c(\w+))?"(?:,\s*"([^"]+)")?/))) {
      o.fontSize = Number(m[1]);
      if (m[2]) o.color = '#' + (COLOR_NAMES[m[2].toLowerCase()] || (/^[0-9a-f]{6}$/i.test(m[2]) ? m[2] : 'FFFFFF'));
      if (m[3] && ['Consolas', 'Cascadia Mono', 'Segoe UI'].includes(m[3])) o.font = m[3];
    }
    if ((m = topText.match(/AddText\("w(\d+)/))) o.width = Number(m[1]);
    if ((m = topText.match(/WinSetTransColor\("\w+\s+(\d+)"/))) o.opacity = Number(m[1]);
    if ((m = topText.match(/SetTimer\(UpdateStatusOverlay,\s*(\d+)\)/))) o.interval = String(m[1]);
    if ((m = body.match(/StrLen\(\w+\)\s*>\s*(\d+)/))) o.clipMax = Number(m[1]);
    if ((m = topText.match(/OverlayPosX\s*:=\s*([\d.]+)/))) o.px = Number(m[1]);
    if ((m = topText.match(/OverlayPosY\s*:=\s*([\d.]+)/))) o.py = Number(m[1]);
    if (/gx\s*:=\s*wr\b/.test(topText)) o.px = 1; else if (/gx\s*:=\s*wl\b/.test(topText) || /GuiX\s*:=\s*\d+/.test(topText)) o.px = 0;
    if (/gy\s*:=\s*wt\b/.test(topText)) o.py = 0; else if (/gy\s*:=\s*wb\b/.test(topText) || /GuiY\s*:=\s*A_ScreenHeight/.test(topText)) o.py = 1;
  }
  const added = [];
  if (!s.tray) { s.tray = true; added.push('أيقونة في شريط المهام تفتح القائمة'); }
  if (!s.extras.startup) { s.extras.startup = true; added.push('زر «التشغيل مع ويندوز» في القائمة'); }
  const nf = blocks.find(b => b.kind === 'func' && (b.name === 'Notify' || b.name === 'NotifyGUI'));
  s.notify = !nf || /ToolTip/.test(nf.body);

  return { state: normalize(s), report: {
    embedded: false, scripts: s.scripts.length, submenus: s.submenus.length,
    items: s.submenus.reduce((a, m) => a + m.items.filter(x => x.label !== '-').length, 0),
    groups: s.groups.length, snippets: s.snippets.length, media: s.media.enabled, overlay: s.overlay.enabled,
    moved: R.moved, skipped: R.skipped, converted: R.converted, added } };
}

let importReport = null;
function reportBox() {
  const r = importReport; if (!r) return null;
  const close = h('button', { type: 'button', class: 'ib', 'aria-label': 'إغلاق', onclick: () => { importReport = null; renderEditor(); } }, '✕');
  if (r.embedded) return h('div', { class: 'report ok' }, close, h('strong', { text: 'تم فتح الملف بكامل إعداداته.' }),
    h('p', { text: 'هذا الملف مصنوع بهذي الأداة، فرجعت كل الإعدادات كما هي بالضبط.' }));
  const got = [];
  if (r.scripts) got.push(r.scripts + ' سكربت');
  if (r.submenus) got.push(r.submenus + ' قوائم فرعية فيها ' + r.items + ' عنصر');
  if (r.groups) got.push(r.groups + ' مجموعة روابط');
  if (r.snippets) got.push(r.snippets + ' نص جاهز');
  if (r.media) got.push('اختصارات الموسيقى');
  if (r.overlay) got.push('الشريط العائم');
  return h('div', { class: 'report' }, close,
    h('strong', { text: 'تم استيراد الملف. راجع الإعدادات قبل ما تنزّل النسخة الجديدة.' }),
    h('p', { text: 'فهمت: ' + (got.join('، ') || 'ولا شيء من الأقسام المعروفة') + '.' }),
    r.converted ? h('p', { text: 'حوّلت مسارات مثل C:\\Users\\اسمك\\…\\سطح المكتب إلى %A_Desktop% عشان تشتغل على أي جهاز. مكانها ما تغيّر على جهازك.' }) : null,
    r.added && r.added.length ? h('p', { text: 'أضفت تحسينات جديدة (تقدر تطفيها): ' + r.added.join('، ') + '.' }) : null,
    r.moved.length ? h('p', {}, 'نقلت هذي للقسم «كود إضافي» كما هي عشان ما تضيع: ', r.moved.join('، '), '.') : null,
    r.skipped.length ? h('details', {}, h('summary', { text: 'أشياء ما قدرت أفهمها (' + r.skipped.length + ')' }), h('ul', {}, r.skipped.map(x => h('li', { text: x })))) : null);
}

async function readFileText(f) {
  const buf = await f.arrayBuffer();
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch { return new TextDecoder('windows-1256').decode(buf); }
}

function secCustom(ed) {
  const ta = h('textarea', { class: 'inp ltr mono', dir: 'ltr', rows: 20, spellcheck: 'false', 'aria-label': 'كود إضافي',
    oninput: e => { S.custom = e.target.value; changed(); } });
  ta.value = S.custom || '';
  ta.addEventListener('keydown', e => {
    if (e.key !== 'Tab' || e.shiftKey) return;
    e.preventDefault(); const a = ta.selectionStart, b = ta.selectionEnd;
    ta.value = ta.value.slice(0, a) + '    ' + ta.value.slice(b); ta.selectionStart = ta.selectionEnd = a + 4; S.custom = ta.value; changed();
  });
  ed.append(h('h2', { text: 'كود إضافي' }),
    h('p', { class: 'lead', text: 'أي كود AutoHotkey v2 تكتبه هنا ينضاف كما هو في آخر الملف: اختصارات أو وظائف خاصة فيك. ولما تستورد ملف، الأجزاء اللي الأداة ما تعرفها تنحط هنا تلقائياً عشان ما تضيع.' }),
    ta,
    h('div', { class: 'tip' }, 'وظائف جاهزة تقدر تستخدمها: ',
      h('code', { text: 'OpenTarget("https://…", "الاسم")' }), ' ', h('code', { text: 'Notify("رسالة")' }), ' ',
      h('code', { text: 'PasteText("نص")' }), ' ', h('code', { text: 'OpenGroup(["رابط1", "رابط2"])' }),
      '. والوظائف القديمة مثل ', h('code', { text: 'OpenURL' }), ' و', h('code', { text: 'NotifyGUI' }), ' تشتغل بعد.'));
}

function renderAll() { renderNav(); renderEditor(); refresh(); }
renderAll();
